<ta-page
  [chrome]="{ enableBackButton: true, showHeaderMenu: false, showFooter: false }"
>
  <ion-content class="ion-padding content-safe-padding-bottom">
    <h1>{{ 'market-place' | transloco }}</h1>

    <div class="ion-margin-top">
      @if (biteTrails(); as trails) { @for (biteTrail of trails; track
      biteTrail.id) {
      <bite-trail
        [biteTrail]="biteTrail"
        (goToProfile)="service.onGoToProfileClick($event)"
        (viewBiteTrail)="service.onViewBiteTrail($event)"
      />
      } }
    </div>
  </ion-content>
</ta-page>
