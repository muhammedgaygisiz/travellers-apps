<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>Create Restaurant</h1>

    <form [formGroup]="restaurantFormGroup">
      <image-upload formControlName="image" />

      <ion-input
        label="Restaurant Name"
        formControlName="name"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <ion-textarea
        class="ion-margin-top"
        label="{{ 'about-restaurant' | transloco }}"
        formControlName="description"
        fill="outline"
        auto-grow="true"
        [maxlength]="500"
        [rows]="6"
        mode="md"
      />

      <ion-input
        label="{{ 'street' | transloco }}"
        formControlName="street"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <div class="ion-display-flex ion-gap-2 ion-margin-top">
        <ion-input
          label="{{ 'postcode' | transloco }}"
          formControlName="postcode"
          fill="outline"
          mode="md"
          class="ion-flex-1 ion-margin-end"
        />
        <ion-input
          label="{{ 'city' | transloco }}"
          formControlName="city"
          fill="outline"
          mode="md"
          class="ion-flex-1"
        />
      </div>

      <ion-input
        label="{{ 'country' | transloco }}"
        formControlName="country"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <div class="ion-padding-top">
        <position formControlName="position" />
      </div>

      @let bites = restaurant()?.bites || [];
      @for (bite of bites; track bite.id) {
        <bt-bite [bite]="bite" (biteClick)="biteClick.emit($event)" />
      }
    </form>

    <div [formGroup]="socialMediaForm" class="ion-margin-top">
      @if (links.length === 0) {
        <ion-text>{{ 'no-social-media-links' | transloco }}</ion-text>
      }

      <div class="ion-margin-top">
        <ion-list lines="full" formArrayName="links">
          @for (socialMedia of links.controls; track $index; let i = $index) {
            <ion-item [formGroupName]="i">
              <ion-select
                class="ion-margin-end"
                placeholder="Social Network"
                interface="popover"
                formControlName="network"
              >
                <ion-select-option value="facebook">Facebook</ion-select-option>
                <ion-select-option value="instagram">Instagram</ion-select-option>
                <ion-select-option value="twitter">Twitter</ion-select-option>
                <ion-select-option value="linkedin">LinkedIn</ion-select-option>
                <ion-select-option value="website">Website</ion-select-option>
              </ion-select>
              <ion-input placeholder="Link" formControlName="url"></ion-input>
            </ion-item>
          }

          <ion-button class="ion-margin-top" (click)="addSocialMedia()">
            Add Link
          </ion-button>
        </ion-list>
      </div>
    </div>

    <div class="ion-margin-top">
      <bt-opening-hours
        (submitOpeningHours)="onOpeningHoursChange($event)"
      />
    </div>

    <ion-button
      expand="block"
      color="primary"
      routerDirection="back"
      class="ion-margin-top"
      [disabled]="isInvalid()"
      (click)="saveNewRestaurant()"
    >
      Save
    </ion-button>
  </ion-content>
</ta-page>
