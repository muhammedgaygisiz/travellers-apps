<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>{{ title() }}</h1>
    <image-cropper
      [imageFile]="imageFile()"
      [allowMoveImage]="true"
      [hideResizeSquares]="false"
      [aspectRatio]="3 / 4"
      [autoCrop]="false"
      backgroundColor="black"
      output="blob"
      format="png"
      (imageCropped)="onImageCropped($event)"
      (loadImageFailed)="onLoadImageFailed()"
    />
  </ion-content>
</ta-page>
