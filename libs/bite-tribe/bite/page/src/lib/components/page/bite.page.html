<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1 class="ion-margin-bottom">Create Bite</h1>

    <form [formGroup]="biteFormGroup">
      <image-upload
        formControlName="image"
        [imageUrl]="imageUrl()"
        [position]="this.fallbackPosition()"
        (positionFromImage)="onPositionFromImage($event)"
        (clearImagePath)="resetImagePath()"
      />

      <ion-input
        label="Dish Name?"
        formControlName="name"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <ion-input
        label="Place Name?"
        formControlName="place"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      >
        <ion-icon
          id="restaurant-selector-trigger-bite"
          slot="end"
          name="search-outline"
          aria-label="Search for restaurant"
        />
      </ion-input>

      <div class="price-container ion-margin-bottom">
        <div class="price">
          <ion-input
            label="Price?"
            formControlName="price"
            fill="outline"
            inputmode="decimal"
            mode="md"
          >
            <ion-text
              id="currency-selector-trigger-bite"
              class="currency-selector"
              slot="end"
            >
              {{ selectedCurrencyName() }}
              <ion-icon name="chevron-expand-outline" />
            </ion-text>
          </ion-input>
        </div>
      </div>

      <star-rating formControlName="rating" label="Your Rating?" />

      <div class="ion-margin-vertical description">
        <ion-textarea
          label="Description?"
          formControlName="description"
          fill="outline"
          auto-grow="true"
          [maxlength]="500"
          placeholder="What did you like about this dish, tell us about it!"
          [rows]="6"
          mode="md"
        />
      </div>

      <bt-tags-input
        [tags]="biteFormGroup.get('tags')?.value || []"
        [suggestedTags]="suggestedTags()"
        (tagChanges)="setTags($event)"
      />

      <div class="ion-padding-top">
        <ion-label class="map-label"
          >Location (tap map to move location manually):</ion-label
        >
        <div class="position-button-container">
          <ion-button
            [disabled]="!imagePosition()"
            (click)="onPositionFromImage(imagePosition())"
          >
            From photo @if (locationFromImage()) {
            <ion-icon name="checkmark-outline" />
            }
          </ion-button>
          <ion-button
            [disabled]="!position()"
            (click)="onPositionFromNavigator()"
          >
            From GPS @if (locationFromGps()) {
            <ion-icon name="checkmark-outline" />
            }
          </ion-button>
        </div>
        <position formControlName="position" />
        @if (biteFormGroup.get('position')?.invalid) {
        <ion-text color="danger">
          <p>{{ getGpsErrorMessage() }}</p>
        </ion-text>
        }
      </div>

      <ion-button
        expand="block"
        color="primary"
        routerDirection="back"
        class="ion-margin-top safe-padding-bottom"
        [disabled]="isInvalid()"
        (click)="saveBite()"
      >
        Post
      </ion-button>
    </form>
  </ion-content>
</ta-page>

<ion-modal trigger="currency-selector-trigger-bite" #currencyModalBite>
  <ng-template>
    <currency-selector
      class="ion-page"
      [selectedCurrency]="biteFormGroup.get('currency')?.value || 'EUR'"
      (currencySelected)="onCurrencySelected($event, currencyModalBite)"
      (selectionCancel)="currencyModalBite.dismiss()"
    />
  </ng-template>
</ion-modal>

<ion-modal trigger="restaurant-selector-trigger-bite" #restaurantModalBite>
  <ng-template>
    <lib-restaurant-selector
      class="ion-page"
      [restaurants]="nearbyRestaurants()"
      [selectedRestaurant]="biteFormGroup.get('place')?.value || ''"
      (restaurantSelected)="onRestaurantSelected($event, restaurantModalBite)"
      (selectionCancel)="restaurantModalBite.dismiss()"
    />
  </ng-template>
</ion-modal>
