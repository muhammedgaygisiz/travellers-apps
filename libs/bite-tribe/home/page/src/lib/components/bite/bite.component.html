@let biteData = bite();

<div class="container">
  <div class="bite-container">
    <ion-card (click)="biteClick.emit(biteData)">
      <div class="card-content">
        <div class="card-image">
          <img alt="Dish" [src]="biteData?.image" />
        </div>
        <div class="card-details">
          <ion-card-header>
            <ion-card-subtitle>{{ biteData?.place }}</ion-card-subtitle>
            <ion-card-title>{{ biteData?.name }}</ion-card-title>
          </ion-card-header>

          <ion-card-content>{{
            biteData?.distance | toMetric
          }}</ion-card-content>
        </div>
      </div>
    </ion-card>
  </div>
  <div class="like-container">
    <ion-chip class="{{ calcClass() }}" (click)="openLikeOptions($event)">
      @let numberLikes = biteData | countLikes;
      <ion-label class="{{ numberLikes ? 'ion-margin-end' : '' }}"
        >👍</ion-label
      >
      @if(numberLikes) {
      <ion-badge>{{ numberLikes }}</ion-badge>
      }
    </ion-chip>
  </div>
</div>
