<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>Create Restaurant</h1>

    <form [formGroup]="restaurantFormGroup">
      <image-upload formControlName="image" />

      <ion-input
        label="Restaurant Name"
        formControlName="name"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <div class="ion-padding-top">
        <position formControlName="position" />
      </div>

      @let bites = restaurant()?.bites || []; @for (bite of bites; track
      bite.id) {
      <bt-bite [bite]="bite" (biteClick)="biteClick.emit($event)" />
      }

      <ion-button
        expand="block"
        color="primary"
        routerDirection="back"
        class="ion-margin-top"
        [disabled]="isInvalid()"
        (click)="saveNewRestaurant()"
      >
        Save
      </ion-button>
    </form>
  </ion-content>
</ta-page>
