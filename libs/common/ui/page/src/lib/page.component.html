<div class="ion-page">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-buttons slot="start">
        @if (enableBackButton()) {
        <ion-back-button defaultHref="/" />
        }
      </ion-buttons>

      <ion-title>
        <ion-icon [name]="appIcon()" />
        {{ appTitle() }}
      </ion-title>

      @if (showHeaderMenu()) {
      <ion-buttons slot="end">
        <ion-button data-cy="btn-menu" (click)="showMenuPopover($event)">
          <ion-icon slot="icon-only" name="menu-outline" />
        </ion-button>
      </ion-buttons>
      }
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div class="outer-content-container">
      <div class="inner-content-container">
        <ng-content></ng-content>
      </div>
    </div>
  </ion-content>

  <ng-container>
    @if (showAddButton()) {
    <ion-fab vertical="bottom" horizontal="center" slot="fixed">
      <ion-fab-button color="light" (click)="addButtonClick.emit($event)">
        <ion-icon name="add" />
      </ion-fab-button>
    </ion-fab>
    } @if (showFooter()) {
    <ion-footer>
      <ion-toolbar />
    </ion-footer>
    }
  </ng-container>
</div>
