<ta-page
  [showHeaderMenu]="false"
  [showAddButton]="false"
  [enableBackButton]="true"
  [showFooter]="false"
>
  <ion-content>
    <ion-img [src]="restaurant()?.imagePath || restaurant()?.image" class="place-image" />

    <div class="ion-padding">
      <h1>{{ placeName() }}</h1>

      <bt-menu
        [menu]="menu()"
        (createBiteClick)="createBiteClick.emit($event)"
      />
    </div>
  </ion-content>
</ta-page>
