<ta-page
  [chrome]="{
    enableBackButton: true,
    showHeaderMenu: false,
    showFooter: false,
  }"
  [isAuthenticated]="isAuthenticated()"
  (logoutClick)="logoutClick.emit()"
>
  <ion-content>
    <div
      class="container"
      [class.has-side-panel]="!!selectedBite && isWideScreen()"
    >
      <bt-map
        readonly
        emitMarkerClick
        [enableZoom]="enableZoom()"
        [geopoints]="positions()"
        [gpsPosition]="gpsPosition()"
        (clickOnMarker)="onGeopointSelection($event)"
        (touchstart)="keepTouchOnMap($event)"
      />
      @if (showMyPositionButton()) {
        <ion-fab
          class="my-position-fab"
          slot="fixed"
          vertical="bottom"
          horizontal="end"
        >
          <ion-fab-button
            data-testid="btn-my-position"
            color="light"
            [attr.aria-label]="'my-position' | transloco"
            (click)="onMyPositionClick()"
          >
            <ion-icon name="locate-outline" />
          </ion-fab-button>
        </ion-fab>
      }
      @if (selectedBite) {
        @if (isWideScreen()) {
          <aside class="side-panel" data-testid="map-side-panel">
            <div class="side-panel-header">
              <h4 class="bite-title">
                {{ selectedBite.name }}
              </h4>
              <ion-button
                fill="clear"
                color="medium"
                data-testid="map-side-panel-close"
                [attr.aria-label]="'close' | transloco"
                (click)="closeSelectedBite()"
              >
                <ion-icon name="close-outline" slot="icon-only" />
              </ion-button>
            </div>
            <bt-bite
              [bite]="selectedBite"
              [userId]="userId()"
              (biteClick)="biteClick.emit($event)"
              (likeButtonClick)="likeButtonClick.emit($event)"
            />
          </aside>
        } @else {
          <bt-snap-drawer>
            <h4 class="bite-title">
              {{ selectedBite.name }}
            </h4>
            <bt-bite
              [bite]="selectedBite"
              [userId]="userId()"
              (biteClick)="biteClick.emit($event)"
              (likeButtonClick)="likeButtonClick.emit($event)"
            />
          </bt-snap-drawer>
        }
      }
    </div>
  </ion-content>
</ta-page>
