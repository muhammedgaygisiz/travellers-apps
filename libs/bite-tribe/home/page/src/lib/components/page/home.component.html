<ta-page
  [showHeaderMenu]="showHeaderMenu()"
  [showAddButton]="showAddButton()"
  [showSettingsButton]="true"
  [showMyBites]="true"
  [showMyBucketlists]="true"
  [showMyProfile]="true"
  [showAboutButton]="true"
  [showMarketPlaceButton]="true"
  [showGalleryButton]="true"
  [showLeaderboardButton]="true"
  [enableBackButton]="enableBackButton()"
  [showFooter]="showFooter()"
  [isAuthenticated]="isAuthenticated()"
  (logoutClick)="logoutClick.emit()"
  (addButtonClick)="addButtonClick.emit()"
  (gotoSettings)="gotoSettings.emit()"
  (gotoProfile)="gotoMyProfile.emit()"
  (gotoMyBucketlists)="gotoMyBucketlists.emit()"
  (gotoMyBites)="gotoMyBites.emit()"
  (gotoAbout)="gotoAbout.emit()"
  (gotoMarketPlace)="gotoMarketPlace.emit()"
  (gotoGallery)="gotoGallery.emit()"
  (gotoLeaderboard)="gotoLeaderboard.emit()"
>
  @if (showSearch()) {
    <ion-buttons header-end slot="end">
      <ion-button
        data-cy="btn-search"
        (click)="toggleSearch()"
        [attr.aria-pressed]="isSearchVisible()"
      >
        <ion-icon
          slot="icon-only"
          [name]="isSearchVisible() ? 'close-outline' : 'search-outline'"
        />
      </ion-button>
    </ion-buttons>
  }
  <ion-content class="ion-padding">
    <ion-refresher slot="fixed" (ionRefresh)="refreshBites($event)">
      <ion-refresher-content />
    </ion-refresher>

    @if (moreThen5Bites()) {
      <ion-button
        slot="fixed"
        [class.with-safe-distance]="!showFooter()"
        (click)="scrollToTop()"
      >
        <ion-icon name="chevron-up-outline" />
      </ion-button>
    }

    <div class="home-header-container" slot="fixed">
      <ion-text color="secondary" class="subheadline">
        <h4>{{ title() }}</h4>
      </ion-text>

      <bt-home-feed-controls
        [showFilters]="showFilters()"
        [selectedFilters]="selectedFilters()"
        [distance]="distance()"
        [maxPriceFilter]="maxPriceFilter()"
        [showSearchChip]="showSearchChip()"
        [showMap]="showMap()"
        [sorting]="sorting()"
        (gotoSearch)="gotoSearch.emit()"
        (openMapView)="openMapView.emit()"
        (sortingChange)="sortingChange.emit($event)"
      />
    </div>

    <div class="home-scrolling-content-container">
      @if (showBiteSkeleton()) {
        <bt-bite-skeleton-list />
      } @else {
        <ng-container *ngTemplateOutlet="withoutLoadingTemplate" />
      }
    </div>
  </ion-content>
</ta-page>

<ion-modal trigger="select-tags" #modal>
  <ng-template>
    <app-type-ahead
      class="ion-page"
      title="Filters"
      [items]="allTags()"
      [selectedItems]="selectedFilters()"
      [distance]="distance()"
      [currency]="preferedCurrency()"
      [price]="maxPriceFilter()"
      (selectionChange)="onFilterChange($event, modal)"
      (selectionCancel)="modal.dismiss()"
      (clearFilters)="onFiltersClear(modal)"
    />
  </ng-template>
</ion-modal>

<ng-template #withoutLoadingTemplate>
  @if (hasErrorLoadingGpsPosition()) {
    <bt-gps-error-card
      (retryClick)="refresh.emit()"
      (closeClick)="closeGpsError.emit()"
    />
  }

  @if (networkStatus()?.connected === false) {
    <bt-network-error-box />
  }

  @if (isSearchVisible()) {
    <ion-searchbar
      data-cy="search-input"
      placeholder="Search ..."
      [value]="searchTerm()"
      (ionInput)="onSearchInput($event)"
      [animated]="true"
    />
  }

  <bt-bite-list
    [bites]="displayedBites()"
    [userId]="userId()"
    [editableBites]="editableBites()"
    [hasErrorLoadingGpsPosition]="hasErrorLoadingGpsPosition()"
    [showTriedOutCheckbox]="showTriedOutCheckbox()"
    [triedOutBiteIds]="triedOutBiteIds()"
    [hasMore]="hasMore()"
    (biteClick)="biteClick.emit($event)"
    (likeButtonClick)="likeButtonClick.emit($event)"
    (gotoEdit)="gotoEdit.emit($event)"
    (deleteBite)="deleteBite.emit($event)"
    (rateNowClick)="rateNowClick.emit($event)"
    (triedOutChange)="triedOutChange.emit($event)"
    (loadMore)="onLoadMore()"
  />
</ng-template>
