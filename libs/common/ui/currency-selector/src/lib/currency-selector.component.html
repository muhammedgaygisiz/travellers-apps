<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" i18n>Cancel</ion-button>
    </ion-buttons>
    <ion-title i18n>Select Currency</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar
    (ionInput)="searchbarInput($event)"
    placeholder="Search currencies..."
    i18n-placeholder
  />

  <ion-list [inset]="true">
    @for (currency of filteredCurrencies(); track currency.code) {
      <ion-item [detail]="false" (click)="selectCurrency(currency.code)">
        <ion-label>
          <h2>{{ currency.name }}</h2>
          <p>{{ currency.code }} - {{ currency.symbol }}</p>
        </ion-label>
        @if (selectedCurrency() === currency.code) {
          <ion-icon slot="end" name="checkmark" color="primary" />
        }
      </ion-item>
    } @empty {
      <ion-item>
        <ion-label i18n>No currencies found</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
