@let biteData = bite();

<div class="like-container">
  <ion-chip class="{{ calcClass() }}" (click)="openLikeOptions($event)">
    @if (biteData?.likes?.length) { @for (emoji of getLikeEmojis(); let index =
    $index; track index) {
    <ion-label class="like">{{ emoji }}</ion-label>
    }
    <ion-badge color="tertiary">{{ biteData.likes?.length }}</ion-badge>
    } @else {
    <ion-label class="ion-margin-horizontal">👍</ion-label>
    }
  </ion-chip>
</div>
