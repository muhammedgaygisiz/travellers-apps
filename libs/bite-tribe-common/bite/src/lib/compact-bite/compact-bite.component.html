@let biteData = bite();

<h4 class="bite-title" (click)="biteClick.emit(biteData)">
  {{ biteData.name }}
</h4>
<div class="image">
  <img
    alt="Dish"
    src="{{ biteData.imagePath || biteData?.image }}"
    height="220"
    loading="lazy"
    (click)="biteClick.emit(biteData)"
  />
</div>

<div class="details" (click)="restaurantClick.emit(biteData)">
  <div class="restaurant-info">
    <ion-text color="secondary">
      {{ biteData?.place }}
    </ion-text>

    <bt-distance [distance]="biteData?.distance" />
  </div>
  <bt-likes
    [bite]="biteData"
    [userId]="userId()"
    (likeButtonClick)="likeButtonClick.emit($event)"
  />
</div>
