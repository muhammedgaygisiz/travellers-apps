@let publicUser = this.publicUser();

<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [isAuthenticated]="isAuthenticated()"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1 class="ion-margin-bottom">Edit Profile</h1>

    <form [formGroup]="profileForm">
      <ion-item>
        <div class="profile-image-block" id="select-image">
          @let photoUrl = publicUser?.photoUrl; @if (photoUrl) {
          <img [src]="photoUrl" alt="Profile" class="profile-image" />
          } @else {
          <ion-icon name="person-circle-outline" class="profile-image" />
          }

          <ion-button fill="clear"> Edit</ion-button>
        </div>

        <ion-label>
          <h3>Display Name</h3>
          <ion-input
            placeholder="Enter display name"
            formControlName="displayName"
          />
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <h3>Email</h3>
          <ion-input formControlName="email" />
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <h3>City</h3>
          <ion-input formControlName="city" />
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">
          <h3>About</h3>
        </ion-label>
        <ion-textarea
          formControlName="about"
          placeholder="Tell us about yourself..."
          [rows]="4"
        />
      </ion-item>

      <ion-item>
        <ion-label>Public User</ion-label>
        <ion-toggle
          slot="end"
          formControlName="public"
          (ionChange)="handlePubicChange($event)"
        />
      </ion-item>

      <div class="button-container safe-padding-bottom">
        <ion-button
          [disabled]="isFormInvalid() || isFormPristine()"
          (click)="saveProfile()"
        >
          Save Changes
        </ion-button>
      </div>
    </form>
  </ion-content>
</ta-page>

<ion-alert
  [isOpen]="isOpen()"
  header="Return to Private Profile"
  message="Are you sure you want to return to a private profile? You will be shown as Anonymous."
  [buttons]="confirmationButtons"
  (didDismiss)="handleGoPrivateConfirmation($event)"
/>

<ion-modal
  #profileImageSelectionModal
  trigger="select-image"
  [backdropDismiss]="false"
>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons>
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <ion-title>Profile Image</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <image-upload />
    </ion-content>
  </ng-template>
</ion-modal>
