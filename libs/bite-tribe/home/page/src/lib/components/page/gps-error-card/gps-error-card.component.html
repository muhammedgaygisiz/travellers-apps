<ion-card>
  <ion-card-content>
    <ion-text color="warning" data-testid="gps-error-message">
      {{ messageKey() | transloco }}
    </ion-text>
  </ion-card-content>

  <ion-button
    fill="clear"
    data-testid="gps-error-enable-location"
    (click)="enableLocationClick.emit()"
    >{{ enableLocationLabelKey() | transloco }}</ion-button
  >

  <ion-button
    fill="clear"
    data-testid="gps-error-retry"
    (click)="retryClick.emit()"
    >{{ 'retry' | transloco }}</ion-button
  >
  <ion-button
    fill="clear"
    data-testid="gps-error-close"
    (click)="closeClick.emit()"
    >{{ 'close' | transloco }}</ion-button
  >
</ion-card>
