<ta-page
  [chrome]="{ enableBackButton: true, showHeaderMenu: false, showFooter: false }"
  [loading]="loading()"
>
  <ion-content class="ion-padding content-safe-padding-bottom">
    <div class="gallery-header">
      <h1>{{ 'gallery' | transloco }}</h1>
      <ion-button
        color="danger"
        fill="outline"
        [disabled]="loading() || images().length === 0"
        (click)="confirmDeleteAll()"
      >
        <ion-icon name="trash-outline" slot="start" />
        {{ 'delete-all' | transloco }}
      </ion-button>
    </div>

    @if (loading()) {
    <div class="gallery-state">
      <ion-spinner />
    </div>
    } @else if (images().length === 0) {
    <p class="gallery-state">{{ 'no-local-images-found' | transloco }}</p>
    } @else {
    <div class="gallery-grid">
      @for (image of images(); track image.name; let index = $index) {
      <button
        type="button"
        class="gallery-tile"
        data-testid="gallery-tile"
        (click)="openViewer(index)"
      >
        <img
          [src]="image.src"
          [alt]="'locally-saved-image' | transloco"
          loading="lazy"
        />
      </button>
      }
    </div>
    }
  </ion-content>

  @let openAt = viewerIndex();
  <ion-modal [isOpen]="openAt !== undefined" (didDismiss)="closeViewer()">
    <ng-template>
      <image-viewer
        [images]="viewerImages()"
        [startIndex]="openAt ?? 0"
        (closed)="closeViewer()"
        (actionSelected)="goToBite($event)"
      />
    </ng-template>
  </ion-modal>
</ta-page>
