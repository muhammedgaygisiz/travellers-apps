<ta-page title="Finances" [showAddButton]="true">
  <ta-card>
    <div class="ion-padding">
      <ion-card-header>
        <ion-card-title>600 $</ion-card-title>
        <ion-card-subtitle>Ihr Vermögen</ion-card-subtitle>
      </ion-card-header>
    </div>

    <div>
      <ion-card-content>
        @for (bank of banks(); track bank.id; let index = $index) {
        <finances-bank [bank]="bank" />
        }
      </ion-card-content>
    </div>
  </ta-card>
</ta-page>
