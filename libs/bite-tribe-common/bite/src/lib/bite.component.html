@let biteData = bite();

<ion-card>
  <div class="card-content">
    <div class="card-image">
      @if (biteData.image || biteData.imagePath) {
        <img
          alt="Dish"
          class="cursor-pointer"
          src="{{ biteData | getImage | async }}"
          height="220"
          loading="lazy"
          (click)="biteClick.emit(biteData)"
        />
      }
    </div>

    <div class="card-details">
      <ion-card-header
        class="ion-display-flex ion-flex-column ion-justify-content-start"
      >
        <ion-card-title (click)="biteClick.emit(biteData)">
          <span class="bite-title cursor-pointer">
            <ion-text color="secondary" class="copytext">
              {{ biteData?.name | withFirstLetterUpperCase }}
            </ion-text>
          </span>
        </ion-card-title>

        <ion-card-subtitle
          class="ion-display-flex ion-justify-content-between ion-align-items-center restaurant-name smalltext"
        >
          <ion-text
            color="secondary"
            class="cursor-pointer"
            (click)="restaurantClick.emit(biteData)"
          >
            {{ biteData?.place }}
          </ion-text>
          <bt-distance
            class="distance"
            [distance]="biteData?.distance"
            [hasErrorLoadingGpsPosition]="hasErrorLoadingGpsPosition()"
          />
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content [class.with-edit]="showEditButton()">
        <div class="rating-container ion-margin-top">
          @if (biteData?.rating) {
            <star-rating [rating]="biteData?.rating" readonly />
          }
        </div>

        @if (!showEditButton() && !readonly()) {
          <bt-likes
            class="ion-margin-top"
            [bite]="biteData"
            [userId]="userId()"
            [inCard]="true"
            (likeButtonClick)="likeButtonClick.emit($event)"
          />
        }
        @if (showEditButton()) {
          <div class="bite-actions ion-margin-top">
            <ion-button (click)="gotoEdit.emit(biteData)">Edit</ion-button>
            <ion-button
              color="danger"
              fill="outline"
              expand="block"
              (click)="openConfirmationDialog()"
            >
              Delete
            </ion-button>
          </div>
        }
      </ion-card-content>
    </div>
  </div>
</ion-card>

<ion-alert
  [isOpen]="isOpen()"
  header="Delete Bite"
  message="Are you sure you want to delete this bite?"
  [buttons]="confirmationButtons"
  (didDismiss)="handleConfirmationDismiss($event)"
/>
