<ta-page
  [chrome]="{ enableBackButton: true, showHeaderMenu: false, showFooter: false }"
>
  <ion-content class="ion-padding">
    <h1 class="ion-margin-bottom">{{ 'edit-bucket-list' | transloco }}</h1>

    <form [formGroup]="titleFormGroup">
      <ion-input
        [label]="'name' | transloco"
        formControlName="name"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <ion-button
        expand="block"
        class="ion-margin-top"
        (click)="onSaveTitle()"
        [disabled]="!titleFormGroup.valid"
      >
        {{ 'save' | transloco }}
      </ion-button>
    </form>

    @if (bites().length > 0) {
    <ion-list class="ion-margin-top">
      <ion-list-header>
        <ion-label>{{ 'bites' | transloco }}</ion-label>
      </ion-list-header>
      @for (bite of bites(); track bite.id) {
      <ion-item>
        <ion-label>{{ bite.name }}</ion-label>
        <ion-button
          slot="end"
          fill="clear"
          color="danger"
          size="small"
          (click)="openRemoveBiteConfirmation(bite.id, $event)"
        >
          {{ 'delete' | transloco }}
        </ion-button>
      </ion-item>
      }
    </ion-list>
    }

    <ion-alert
      [isOpen]="isRemoveBiteAlertOpen()"
      [header]="'remove-bite-from-bucket-list-title' | transloco"
      [message]="'remove-bite-from-bucket-list-message' | transloco"
      [buttons]="removeBiteConfirmationButtons"
      (didDismiss)="handleRemoveBiteDismiss($event)"
    />
  </ion-content>
</ta-page>
