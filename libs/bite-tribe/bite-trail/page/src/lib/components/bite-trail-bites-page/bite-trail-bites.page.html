<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <div class="bite-trail-header-container" slot="fixed">
      <ion-text color="secondary" class="subheadline">
        <h4>{{ title() }}</h4>
      </ion-text>

      <div
        class="chip-sort-filter-container ion-display-flex ion-flex-row ion-justify-content-center ion-margin-bottom"
      >
        <ion-chip (click)="openMapView.emit()">
          <ion-icon name="map-outline" />
          <ion-text color="secondary">Map</ion-text>
        </ion-chip>

        <ion-chip id="select-sorting">
          <ion-select
            interface="modal"
            toggleIcon="chevron-down-outline"
            [value]="sorting()"
            [placeholder]="sortingLabel()"
            (ionChange)="emitSortingChange($event)"
          >
            <ion-select-option value="distance">Distance</ion-select-option>
            <ion-select-option value="createdAt">Date</ion-select-option>
            <ion-select-option value="likes">Likes</ion-select-option>
            <ion-select-option value="rating">Rating</ion-select-option>
            <ion-select-option value="price">Price</ion-select-option>
          </ion-select>
        </ion-chip>
      </div>
    </div>

    <div class="bite-trail-scrolling-content-container">
      @if (!bites()?.length) {
      <ion-card>
        <ion-card-content>
          <ion-text color="primary">No bites found in this trail.</ion-text>
        </ion-card-content>
      </ion-card>
      } @for (bite of bites(); track bite.id) {
      <bt-bite
        [bite]="bite"
        [userId]="userId()"
        (biteClick)="biteClick.emit($event)"
        (restaurantClick)="restaurantClick.emit($event)"
        (likeButtonClick)="likeButtonClick.emit($event)"
      />
      }
    </div>
  </ion-content>
</ta-page>
