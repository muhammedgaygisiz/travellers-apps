<ta-page
  [showHeaderMenu]="false"
  [showFooter]="isFree()"
  [showAddButton]="isFree()"
  [addButtonText]="toggleAddButtonText()"
  [enableBackButton]="true"
  (addButtonClick)="savedBucketlistId() ? goToSavedBucketList.emit() : getForFree.emit()"
>
  <ion-content class="ion-padding">
    <div class="bite-trail-header-container" slot="fixed">
      <ion-text color="secondary" class="subheadline">
        <h4>{{ title() }}</h4>
      </ion-text>

      <div
        class="chip-map-sort-container ion-display-flex ion-flex-row ion-justify-content-center"
      >
        <div class="chip-container ion-display-flex ion-flex-wrap">
          <ion-chip (click)="openMapView.emit()">
            <ion-icon name="map-outline" />
            <ion-text color="secondary">Bitemap</ion-text>
          </ion-chip>
        </div>
      </div>
    </div>

    <div class="bite-trail-scrolling-content-container">
      @if (savedBucketlistId()) {
      <ion-card class="saved-hint-card">
        <ion-card-content class="ion-display-flex ion-align-items-center">
          <ion-icon
            name="checkmark-circle-outline"
            color="success"
            class="ion-margin-end"
            size="large"
          />
          <ion-text color="secondary"
            >{{ 'you-already-saved-this-bite-trail-to-your-bucket-list' |
            transloco }}</ion-text
          >
        </ion-card-content>
      </ion-card>
      } @if (!bites().length) {
      <ion-card>
        <ion-card-content>
          <ion-text color="primary"
            >{{ 'no-bites-found-in-this-trail' | transloco }}</ion-text
          >
        </ion-card-content>
      </ion-card>
      } @for (bite of bites(); track bite.id) {
      <bt-bite
        [bite]="bite"
        [userId]="userId()"
        [readonly]="true"
        (biteClick)="biteClick.emit($event)"
        (restaurantClick)="restaurantClick.emit($event)"
      />
      }
    </div>
  </ion-content>
</ta-page>
