<ta-page
  [showHeaderMenu]="false"
  [showFooter]="true"
  [showAddButton]="true"
  addButtonText="Create new bucket list"
  (addButtonClick)="openAlert()"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <div class="bucketlists-header-container" slot="fixed">
      <ion-text color="secondary" class="subheadline">
        <h4>{{ title() }}</h4>
      </ion-text>
      <div class="chip-sort-filter-container">
        <div class="sort-container">
          <ion-chip id="select-sorting">
            <ion-select
              interface="modal"
              toggleIcon="chevron-down-outline"
              [value]="sorting()"
              [placeholder]="sortingLabel()"
              (ionChange)="emitSortingChange($event)"
            >
              <ion-select-option value="name">Name</ion-select-option>
              <ion-select-option value="createdAt">Date</ion-select-option>
            </ion-select>
          </ion-chip>
        </div>
      </div>
    </div>

    <ion-list lines="full" class="bucketlists-scrolling-content-container">
      @for (bucketlist of bucketlists(); track bucketlist.id) {
      <ion-item
        [button]="true"
        (click)="gotoBucketlistDetails.emit(bucketlist.id)"
      >
        <ion-icon name="bookmark" slot="start" />
        <div class="bucketlist-content">
          <ion-label>{{ bucketlist.name }}</ion-label>
          <div class="bucketlist-actions">
            <ion-button
              fill="clear"
              size="small"
              (click)="onEditBucketlist(bucketlist.id, $event)"
            >
              Edit
            </ion-button>
            <ion-button
              fill="clear"
              size="small"
              color="danger"
              (click)="openDeleteConfirmation(bucketlist.id, $event)"
            >
              Delete
            </ion-button>
          </div>
        </div>
        <ion-badge>{{ bucketlist.biteIds | count }}</ion-badge>
      </ion-item>
      }
    </ion-list>

    <ion-alert
      [isOpen]="isAlertOpen()"
      header="Please enter a name for your new list"
      [inputs]="newListInputs"
      [buttons]="saveButton"
    />

    <ion-alert
      [isOpen]="isDeleteAlertOpen()"
      header="Delete Bucket List"
      message="Are you sure you want to delete this bucket list?"
      [buttons]="deleteConfirmationButtons"
      (didDismiss)="handleDeleteConfirmationDismiss($event)"
    />
  </ion-content>
</ta-page>
