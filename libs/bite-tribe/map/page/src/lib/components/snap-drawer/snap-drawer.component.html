<div
  class="drawer"
  [style.--snap-drawer-offset]="translateY + 'px'"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
>
  <div
    class="handle"
    role="button"
    tabindex="0"
    (click)="snapOpenOrClosed()"
    (keydown.enter)="snapOpenOrClosed()"
    (keydown.space)="snapOpenOrClosed()"
  ></div>
  <ng-content></ng-content>
</div>
