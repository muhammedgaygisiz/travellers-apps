<ta-page
  [showHeaderMenu]="false"
  [showLanguages]="false"
  [showAddButton]="false"
  [enableBackButton]="true"
  [showFooter]="false"
>
  <ion-content>
    @defer { @if (restaurant()?.image) {
    <ion-img [src]="restaurant()?.image" class="place-image" />
    } @else {
    <ion-img
      [src]="'assets/placeholder-restaurant.png'"
      class="full-size-image"
    />
    } } @placeholder (minimum 1000ms) {
    <div class="image-loading-placeholder">
      <ion-icon name="download-outline" color="primary" />
    </div>
    }

    <div class="ion-padding">
      <div class="header-container">
        <h1>{{ placeName() }}</h1>

        @if (restaurant()) {
        <ion-button fill="clear" (click)="showMenuClick.emit(restaurant())">
          <ion-icon slot="start" name="restaurant-outline"></ion-icon>
          Menu
        </ion-button>
        }
      </div>

      {{ placeDistance() | toMetric }}
    </div>
  </ion-content>
</ta-page>
