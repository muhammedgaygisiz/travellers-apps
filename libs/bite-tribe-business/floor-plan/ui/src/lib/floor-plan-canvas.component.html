<svg
  #floorPlanCanvas
  class="floor-plan-canvas__surface"
  [class.floor-plan-canvas__surface--panning]="panning()"
  [attr.viewBox]="viewBox()"
  preserveAspectRatio="xMidYMid meet"
  role="application"
  tabindex="0"
  [attr.aria-label]="
    'floor-plan-canvas-label' | transloco: { room: room()?.name ?? '' }
  "
  [attr.aria-activedescendant]="activeDescendant()"
  data-testid="floor-plan-canvas"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  (wheel)="onWheel($event)"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
  (keydown)="onKeyDown($event)"
>
  @if (room(); as plan) {
    @let view = viewport();

    <defs>
      <clipPath [attr.id]="clipPathId">
        <rect
          [attr.x]="view.x"
          [attr.y]="view.y"
          [attr.width]="view.width"
          [attr.height]="view.height"
        />
      </clipPath>

      <pattern
        [attr.id]="gridPatternId"
        [attr.width]="gridSpacing()"
        [attr.height]="gridSpacing()"
        patternUnits="userSpaceOnUse"
      >
        <path
          class="floor-plan-canvas__grid-line"
          [attr.d]="gridPath()"
          [attr.stroke-width]="hairline()"
        />
      </pattern>
    </defs>

    <g [attr.clip-path]="clipPathUrl">
      <rect
        class="floor-plan-canvas__floor"
        x="0"
        y="0"
        [attr.width]="plan.size.width"
        [attr.height]="plan.size.height"
      />

      @if (showGrid()) {
        <rect
          class="floor-plan-canvas__grid"
          x="0"
          y="0"
          [attr.width]="plan.size.width"
          [attr.height]="plan.size.height"
          [attr.fill]="gridPatternUrl"
          data-testid="floor-plan-grid"
        />
      }

      <rect
        class="floor-plan-canvas__wall"
        x="0"
        y="0"
        [attr.width]="plan.size.width"
        [attr.height]="plan.size.height"
        [attr.stroke-width]="hairline() * 3"
        data-testid="floor-plan-room-outline"
      />

      <!--
        The geometry and the tables. One `<g>` per item, turned about its own
        centre, so `rotation` is a number in the model rather than a transform
        string parsed back out of the DOM.
      -->
      <g data-testid="floor-plan-items">
        @for (item of itemViews(); track item.id) {
          <!--
            Named rather than merely drawn (GitHub issue #1089). A shape with no
            accessible name is announced as nothing at all, so a plan a screen
            reader walked through was twenty identical silences. The name is
            what the object *is* - its type, and for a table its number, its
            capacity and whether it is in service - because that is what the
            owner is looking for; where it stands is the drawing's job.
          -->
          <g
            [attr.id]="item.domId"
            role="img"
            [attr.aria-label]="
              item.nameKey
                | transloco
                  : {
                      type: item.typeKey | transloco,
                      label:
                        item.label ||
                        ('floor-plan-item-unnumbered' | transloco),
                      seats: item.seats,
                    }
            "
            [attr.class]="item.classes"
            [attr.transform]="item.transform"
            [attr.data-item-id]="item.id"
          >
            @if (item.round) {
              <circle
                [attr.cx]="item.cx"
                [attr.cy]="item.cy"
                [attr.r]="item.radius"
                [attr.stroke-width]="item.strokeWidth"
              />
            } @else {
              <rect
                [attr.x]="item.x"
                [attr.y]="item.y"
                [attr.width]="item.width"
                [attr.height]="item.height"
                [attr.stroke-width]="item.strokeWidth"
              />
            }

            @if (item.label) {
              <text
                class="floor-plan-canvas__item-label"
                [attr.x]="item.cx"
                [attr.y]="item.labelY"
                [attr.font-size]="item.labelSize"
                text-anchor="middle"
                dominant-baseline="central"
              >
                {{ item.label }}
              </text>
            }

            <!--
              The capacity, under the number, behind a seated figure. Drawn on
              the table rather than in a legend beside the plan, because the
              question it answers - does this party fit here - is asked while
              looking at the room. A pictograph and digits rather than a
              sentence, because a round table is about three characters wide at
              zoom-to-fit; the words are in the `<title>`, where a hover and a
              screen reader both find them.
            -->
            @if (item.seats !== undefined) {
              <g
                class="floor-plan-canvas__item-seats"
                [attr.data-testid]="'floor-plan-seats-' + item.id"
              >
                <title>
                  {{
                    'floor-plan-table-seats-count'
                      | transloco: { count: item.seats }
                  }}
                </title>
                <circle
                  [attr.cx]="item.seatHeadX"
                  [attr.cy]="item.seatHeadY"
                  [attr.r]="item.seatHeadRadius"
                />
                <path [attr.d]="item.seatShoulders" />
                <text
                  [attr.x]="item.seatsTextX"
                  [attr.y]="item.seatsY"
                  [attr.font-size]="item.seatsSize"
                  text-anchor="start"
                  dominant-baseline="central"
                >
                  {{ item.seatsText }}
                </text>
              </g>
            }
          </g>
        }
      </g>

      @if (selectionOverlay(); as overlay) {
        <g
          class="floor-plan-canvas__overlay"
          [attr.transform]="overlay.transform"
          data-testid="floor-plan-handles"
        >
          <rect
            class="floor-plan-canvas__outline"
            [attr.x]="overlay.x"
            [attr.y]="overlay.y"
            [attr.width]="overlay.width"
            [attr.height]="overlay.height"
            [attr.stroke-width]="hairline() * 2"
          />

          <line
            class="floor-plan-canvas__rotate-arm"
            [attr.x1]="overlay.rotateX"
            [attr.y1]="overlay.rotateAnchorY"
            [attr.x2]="overlay.rotateX"
            [attr.y2]="overlay.rotateY"
            [attr.stroke-width]="hairline() * 2"
          />
          <circle
            class="floor-plan-canvas__handle floor-plan-canvas__handle--rotate"
            [attr.cx]="overlay.rotateX"
            [attr.cy]="overlay.rotateY"
            [attr.r]="overlay.size / 2"
            [attr.stroke-width]="hairline()"
            data-handle="rotate"
            data-testid="floor-plan-handle-rotate"
          />

          @for (handle of overlay.handles; track handle.handle) {
            <rect
              class="floor-plan-canvas__handle"
              [attr.x]="handle.x"
              [attr.y]="handle.y"
              [attr.width]="overlay.size"
              [attr.height]="overlay.size"
              [attr.stroke-width]="hairline()"
              [attr.data-handle]="handle.handle"
              [attr.data-testid]="'floor-plan-handle-' + handle.handle"
            />
          }
        </g>
      }

      <!--
        Anything the caller projects is drawn in this same millimetre space,
        above the plan. It is where an overlay that is not part of the stored
        layout belongs. The validation findings of issue #1088 are listed
        beside the canvas rather than drawn on it, for the same reason: the
        canvas is handed a room and draws it.
      -->
      <ng-content />
    </g>
  }
</svg>

@if (room()) {
  @let bar = scaleBar();

  <!--
    The scale reference is pinned to the element rather than drawn on the plan,
    because the letterbox it stands in is outside the viewBox. Inert to the
    pointer, so it cannot swallow a drag that starts in the corner it sits in.
  -->
  <div class="floor-plan-canvas__scale" data-testid="floor-plan-scale">
    <span
      class="floor-plan-canvas__scale-bar"
      [style.width.px]="bar.pixels"
    ></span>
    <span>{{ bar.caption }}</span>
  </div>
}

<div class="floor-plan-canvas__controls">
  <ion-button
    size="small"
    fill="solid"
    color="light"
    [disabled]="!room()"
    [attr.aria-label]="'floor-plan-zoom-in' | transloco"
    [title]="'floor-plan-zoom-in' | transloco"
    data-testid="floor-plan-zoom-in"
    (click)="zoomIn()"
  >
    <ion-icon name="add-outline" slot="icon-only" />
  </ion-button>
  <ion-button
    size="small"
    fill="solid"
    color="light"
    [disabled]="!room()"
    [attr.aria-label]="'floor-plan-zoom-out' | transloco"
    [title]="'floor-plan-zoom-out' | transloco"
    data-testid="floor-plan-zoom-out"
    (click)="zoomOut()"
  >
    <ion-icon name="remove-outline" slot="icon-only" />
  </ion-button>
  <ion-button
    size="small"
    fill="solid"
    color="light"
    [disabled]="!room()"
    [attr.aria-label]="'floor-plan-zoom-fit' | transloco"
    [title]="'floor-plan-zoom-fit' | transloco"
    data-testid="floor-plan-zoom-fit"
    (click)="zoomToFit()"
  >
    <ion-icon name="scan-outline" slot="icon-only" />
  </ion-button>
</div>
