<ta-page
  [chrome]="{ showFooter: false, fullWidth: true }"
  [isAuthenticated]="isAuthenticated()"
  (logoutClick)="logoutClick.emit()"
>
  <ion-content class="ion-padding">
    <div class="ion-display-flex ion-flex-row">
      <div
        class="ion-display-flex ion-flex-column column ion-flex-2 ion-padding"
      >
        <ion-card>
          <ion-card-content>
            @if (showMap()) {
              <bt-map
                [gpsPosition]="gpsPosition()"
                [geopoints]="restaurantPositions()"
                enableZoom
                readonly
              />
            }
          </ion-card-content>
        </ion-card>
      </div>
      <div
        class="ion-display-flex ion-flex-column column ion-flex-2 ion-padding"
      >
        <ion-card>
          <ion-card-content>
            <ion-list lines="full" data-testid="dashboard-sections">
              @for (section of sections; track section.path) {
                <ion-item
                  [button]="true"
                  [attr.data-testid]="section.testId"
                  (click)="sectionClick.emit(section)"
                >
                  <ion-icon
                    [name]="section.icon"
                    slot="start"
                    aria-hidden="true"
                  />
                  <ion-label>
                    <h3>{{ section.titleKey | transloco }}</h3>
                    <p>{{ section.descriptionKey | transloco }}</p>
                  </ion-label>
                </ion-item>
              }
            </ion-list>
          </ion-card-content>
        </ion-card>
      </div>
    </div>
  </ion-content>
</ta-page>
