<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>{{ title() }}</h1>

    <form [formGroup]="biteFormGroup">
      <image-upload
        formControlName="image"
        [position]="this.fallbackPosition()"
        (positionFromImage)="onPositionFromImage($event)"
      />

      <ion-input
        label="Dish Name"
        formControlName="name"
        fill="solid"
        class="ion-margin-top"
      />
      <hr />

      <ion-input label="Place Name" formControlName="place" />
      <hr />

      <div>
        <div class="price">
          <ion-input
            label="Price"
            formControlName="price"
            inputmode="numeric"
          />

          <ion-select formControlName="currency" interface="popover">
            <ion-select-option value="EUR">EUR</ion-select-option>
            <ion-select-option value="USD">USD</ion-select-option>
            <ion-select-option value="THB">THB</ion-select-option>
            <ion-select-option value="CHF">CHF</ion-select-option>
            <ion-select-option value="GBP">GBP</ion-select-option>
          </ion-select>
        </div>
        <hr class="sams-favorite-hr" />
        <ion-note>Enter the price in the valid format (e.g. 12.34).</ion-note>
      </div>

      <ion-input label="Tags" formControlName="tags" />

      <div class="ion-padding-top">
        <position formControlName="position" />
        @if (noGpsPosition()) {
        <ion-text color="danger">
          <p>{{ getGpsErrorMessage() }}</p>
        </ion-text>
        }
      </div>

      <ion-button
        expand="block"
        color="primary"
        routerDirection="back"
        class="ion-margin-top"
        [disabled]="isInvalid()"
        (click)="saveBite()"
      >
        Post
      </ion-button>
    </form>
  </ion-content>
</ta-page>
