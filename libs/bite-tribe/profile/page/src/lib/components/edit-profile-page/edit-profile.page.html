<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [isAuthenticated]="isAuthenticated()"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1 class="ion-margin-bottom">{{ 'edit-profile' | transloco }}</h1>

    <form [formGroup]="profileForm">
      <div class="profile-image-block" id="select-image">
        @let photoUrl = this.profileForm.get('photoUrl')?.value; @if (photoUrl)
        {
        <img [src]="photoUrl" alt="Profile" class="profile-image" />
        } @else {
        <ion-icon name="person-circle-outline" class="profile-image" />
        }
        <ion-button fill="clear">{{ 'edit' | transloco }}</ion-button>
      </div>

      <ion-modal
        #profileImageSelectionModal
        trigger="select-image"
        [backdropDismiss]="false"
      >
        <ng-template>
          <ion-header>
            <ion-toolbar>
              <ion-buttons>
                <ion-button (click)="cancel()"
                  >{{ 'cancel' | transloco }}</ion-button
                >
              </ion-buttons>
              <ion-title>{{ 'profile-image' | transloco }}</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            <image-upload formControlName="photoUrl" />

            <ion-button
              expand="block"
              class="ion-margin-top"
              (click)="dismissImageModal()"
              >{{ 'save' | transloco }}
            </ion-button>
          </ion-content>
        </ng-template>
      </ion-modal>

      <ion-input
        label="{{ 'display-name' | transloco }}"
        placeholder="{{ 'enter-display-name' | transloco }}"
        formControlName="displayName"
        fill="outline"
        mode="md"
        class="ion-margin-top"
      />

      <ion-input
        label="{{ 'email' | transloco }}"
        formControlName="email"
        fill="outline"
        mode="md"
        class="ion-margin-top"
      />

      <ion-input
        label="{{ 'city' | transloco }}"
        formControlName="city"
        fill="outline"
        mode="md"
        class="ion-margin-top"
      />

      <ion-textarea
        label="{{ 'about' | transloco }}"
        formControlName="about"
        placeholder="{{ 'tell-us-about-yourself' | transloco }}"
        fill="outline"
        mode="md"
        [rows]="4"
        class="ion-margin-top"
      />

      <ion-item class="ion-margin-top">
        <ion-label>{{ 'public-user' | transloco }}</ion-label>
        <ion-toggle
          slot="end"
          formControlName="public"
          (ionChange)="handlePubicChange($event)"
        />
      </ion-item>

      <div class="button-container safe-padding-bottom">
        <ion-button
          [disabled]="isFormInvalid() || isFormPristine()"
          (click)="saveProfile()"
        >
          {{ 'save-changes' | transloco }}
        </ion-button>
      </div>
    </form>
  </ion-content>
</ta-page>

<ion-alert
  [isOpen]="isOpen()"
  header="{{ 'return-to-private-profile' | transloco }}"
  message="{{ 'are-you-sure-you-want-to-return-to-a-private-profile-you-will-be-shown-as-anonymous' | transloco }}"
  [buttons]="confirmationButtons"
  (didDismiss)="handleGoPrivateConfirmation($event)"
/>
