name: Deploy Finances

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  deploy-finances:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup action
        uses: ./.github/actions/setup

      - name: Build Finances App
        run: npm run nx -- build finances

      - name: Finances Preview of Pull Request
        if: github.event.pull_request.base.ref == 'develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCES_878BE }}'
          projectId: finances-878be
          target: finances
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

      - name: Finances Publish to Firebase
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCES_878BE }}'
          channelId: live
          projectId: finances-878be
          target: finances
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
