@let starIconPath = '/assets/custom-icons/star.svg';
<div class="star-rating">
  <ion-icon
    [src]="starIconPath"
    [class]="(1 | isFilled : hoveredIndex() : getRating()) ? 'filled' : ''"
    size="large"
    (click)="onRate(1)"
    (mouseover)="onHover(1)"
    (mouseleave)="onLeave()"
    [class.read-only]="readOnly()"
  />

  <ion-icon
    [src]="starIconPath"
    [class]="(2 | isFilled : hoveredIndex() : getRating()) ? 'filled' : ''"
    size="large"
    (click)="onRate(2)"
    (mouseover)="onHover(2)"
    (mouseleave)="onLeave()"
    [class.read-only]="readOnly()"
  />

  <ion-icon
    [src]="starIconPath"
    [class]="(3 | isFilled : hoveredIndex() : getRating()) ? 'filled' : ''"
    size="large"
    (click)="onRate(3)"
    (mouseover)="onHover(3)"
    (mouseleave)="onLeave()"
    [class.read-only]="readOnly()"
  />

  <ion-icon
    [src]="starIconPath"
    [class]="(4 | isFilled : hoveredIndex() : getRating()) ? 'filled' : ''"
    size="large"
    (click)="onRate(4)"
    (mouseover)="onHover(4)"
    (mouseleave)="onLeave()"
    [class.read-only]="readOnly()"
  />

  <ion-icon
    [src]="starIconPath"
    [class]="(5 | isFilled : hoveredIndex() : getRating()) ? 'filled' : ''"
    size="large"
    (click)="onRate(5)"
    (mouseover)="onHover(5)"
    (mouseleave)="onLeave()"
    [class.read-only]="readOnly()"
  />
</div>
