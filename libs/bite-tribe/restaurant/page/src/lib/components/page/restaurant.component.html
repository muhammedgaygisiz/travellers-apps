@let restaurantData = restaurant();

<ta-page
  [showHeaderMenu]="false"
  [showLanguages]="false"
  [showAddButton]="false"
  [enableBackButton]="true"
  [showFooter]="false"
>
  <ion-content>
    @defer { @if (restaurantData?.image) {
    <ion-img [src]="restaurantData?.image" class="place-image" />
    } @else {
    <ion-img [src]="'placeholder-restaurant.png'" class="full-size-image" />
    } } @placeholder (minimum 1000ms) {
    <div class="image-loading-placeholder">
      <ion-icon name="download-outline" color="primary" />
    </div>
    }

    <div>
      <div class="ion-padding">
        <div class="header-container">
          <h1>{{ placeName() }}</h1>

          @if (restaurantData) {
          <ion-button fill="clear" (click)="showMenuClick.emit(restaurantData)">
            <ion-icon slot="start" name="restaurant-outline"></ion-icon>
            Menu
          </ion-button>
          }
        </div>

        {{ placeDistance() | toMetric }}

        <div class="ion-margin-top">
          <bt-map [position]="position()" readonly />
        </div>
      </div>

      <div>
        @for (bite of bites(); track bite.id) {
        <bt-bite
          [bite]="bite"
          [userId]="userId()"
          (biteClick)="biteClick.emit($event)"
        />
        }
      </div>
    </div>
  </ion-content>
</ta-page>
