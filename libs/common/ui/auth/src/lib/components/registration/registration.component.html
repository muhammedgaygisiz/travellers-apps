<ta-page
  [showHeaderMenu]="false"
  [enableBackButton]="true"
  [hideAuthButton]="true"
  [showFooter]="false"
>
  <ion-content class="ion-padding">
    <h1 class="ion-margin-bottom">Sign up</h1>

    <div>
      <form [formGroup]="registrationFormGroup">
        <ion-input
          label="Email"
          formControlName="email"
          fill="outline"
          mode="md"
          class="ion-margin-top"
          autocomplete="email"
          inputmode="email"
        />

        <ion-input
          type="password"
          label="Password"
          formControlName="password"
          fill="outline"
          mode="md"
          class="ion-margin-top"
        >
          <ion-input-password-toggle slot="end" />
        </ion-input>

        <ion-input
          type="password"
          label="Confirm Password"
          formControlName="passwordConfirm"
          fill="outline"
          mode="md"
          class="ion-margin-top"
        >
          <ion-input-password-toggle slot="end" />
        </ion-input>

        <ion-button
          class="ion-margin-top"
          expand="block"
          [disabled]="!registrationFormGroup.valid"
          (click)="submitRegistration.emit(registrationFormGroup.value)"
          data-cy="submit"
        >
          Sign up
        </ion-button>

        @if (registrationFormGroup.errors?.['mismatch']) {
          <div class="ion-margin-top">
            <ion-text color="danger"> Password does not match.</ion-text>
          </div>
        }
      </form>
    </div>

    <ta-password-validator
      [password$]="registrationFormGroup.controls['password'].valueChanges"
    />
  </ion-content>
</ta-page>
