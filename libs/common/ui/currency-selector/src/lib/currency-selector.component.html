<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">{{ 'cancel' | transloco }}</ion-button>
    </ion-buttons>
    <ion-title>{{ 'select-currency' | transloco }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar
    (ionInput)="searchbarInput($event)"
    placeholder="{{ 'search-currencies' | transloco }}"
  />

  <ion-list [inset]="true">
    @for (currency of filteredCurrencies(); track currency.code) {
      <ion-item [detail]="false" (click)="selectCurrency(currency.code)">
        <ion-label>
          <h2>{{ currency.name }}</h2>
          <p>{{ currency.code }} - {{ currency.symbol }}</p>
        </ion-label>
        <ion-buttons slot="end">
          @if (selectedCurrency() === currency.code) {
            <ion-icon name="checkmark" color="primary" />
          }
          <ion-button
            fill="clear"
            (click)="toggleFavorite($event, currency.code)"
            [attr.aria-label]="
              isFavorite(currency.code)
                ? 'remove from favorite currencies'
                : 'add to favorite currencies'
            "
          >
            <ion-icon
              [name]="isFavorite(currency.code) ? 'heart' : 'heart-outline'"
              color="danger"
            />
          </ion-button>
        </ion-buttons>
      </ion-item>
    } @empty {
      <ion-item>
        <ion-label>{{ 'no-currencies-found' | transloco }}</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
