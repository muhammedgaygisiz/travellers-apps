<ta-page
  [showHeaderMenu]="true"
  [showLanguages]="false"
  [showAddButton]="false"
  [showFooter]="false"
  [showSettingsButton]="false"
  [fullWidth]="true"
  [isAuthenticated]="isAuthenticated()"
  (logoutClick)="logoutClick.emit()"
  (gotoSettings)="gotoSettings.emit()"
>
  <ion-content class="ion-padding">
    <div class="desktop-layout">
      <div class="first-column">
        <h1>Restaurants</h1>
      </div>

      <div class="restaurants-grid">
        @if (!restaurants()?.length) {
        <ion-card>
          <ion-card-content>
            <ion-text color="primary"> No restaurants found. </ion-text>
          </ion-card-content>
        </ion-card>
        } @for (restaurant of restaurants(); let index = $index; track
        restaurant.id || index) {
        <bt-restaurant
          [restaurant]="restaurant"
          (restaurantClick)="restaurantClick.emit($event)"
          (createRestaurant)="createRestaurantClick.emit($event)"
        />
        }
      </div>
    </div>
  </ion-content>
</ta-page>
