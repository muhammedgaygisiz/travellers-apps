@let categoryData = linkedCategory();
<div class="menu-category">
  <h2>
    <ion-input
      [formField]="categoryForm.title"
      fill="outline"
      mode="md"
      class="ion-margin-top"
    />
  </h2>
  <ion-input
    [formField]="categoryForm.subtitle"
    fill="outline"
    mode="md"
    class="ion-margin-top"
  />
  @if (categoryData?.items?.length) {
    <ion-reorder-group (ionItemReorder)="handleReorder($any($event))">
      @for (item of categoryData?.items; let index = $index; track item.id) {
        <div class="reorder-container ion-padding">
          <div class="reorder-anchor">
            <ion-reorder>
              <ion-icon name="menu" size="large" color="primary" />
            </ion-reorder>
          </div>
          <business-menu-item
            [currencySymbol]="currencySymbol()"
            class="ion-padding"
            [item]="item"
            (addedVariant)="onAddVariant($event, item)"
            (itemChanged)="onChangeItem($event, index)"
          />
        </div>
      }
    </ion-reorder-group>
    <ng-container [ngTemplateOutlet]="addItem" />
  } @else {
    <div class="menu-placeholder">
      <p>No items in this category yet.</p>
    </div>

    <ng-container [ngTemplateOutlet]="addItem" />
  }

  <!--
    The category's extras (issue #1598). Below the items, because that is
    where the menu prints them and because they are a property of the section
    rather than of any one dish in it.
  -->
  <business-category-extras
    [extrasBlock]="categoryData?.extrasBlock"
    [currencySymbol]="currencySymbol()"
    (extrasBlockChanged)="onExtrasBlockChanged($event)"
  />
</div>

<ng-template #addItem>
  @if (shouldShowAddItem()) {
    <business-menu-variant
      (addItem)="onAddItem($event)"
      (cancelAddItem)="onCancelAddItem()"
    />
  }
  @if (!shouldShowAddItem()) {
    <ion-button (click)="showAddItem()" class="ion-margin-top">
      Add Item
    </ion-button>
  }
</ng-template>
