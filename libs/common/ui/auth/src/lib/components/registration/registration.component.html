<ta-page
  [chrome]="{
    enableBackButton: true,
    showHeaderMenu: false,
    showFooter: false,
  }"
  [menuConfig]="{ hideAuth: true }"
>
  <ion-content class="ion-padding">
    <h1 class="ion-margin-bottom">{{ 'sign-up' | transloco }}</h1>

    <div>
      <form [formGroup]="registrationFormGroup">
        <ion-input
          label="{{ 'email' | transloco }}"
          formControlName="email"
          fill="outline"
          mode="md"
          class="ion-margin-top"
          autocomplete="email"
          inputmode="email"
          data-testid="email"
        />

        <ion-input
          type="password"
          label="{{ 'password' | transloco }}"
          formControlName="password"
          fill="outline"
          mode="md"
          class="ion-margin-top"
          data-testid="password"
        >
          <ion-input-password-toggle slot="end" />
        </ion-input>

        <ion-input
          type="password"
          label="{{ 'confirm-password' | transloco }}"
          formControlName="passwordConfirm"
          fill="outline"
          mode="md"
          class="ion-margin-top"
          data-testid="password-confirm"
        >
          <ion-input-password-toggle slot="end" />
        </ion-input>

        <ion-button
          class="ion-margin-top"
          expand="block"
          [disabled]="!registrationFormGroup.valid"
          (click)="submitRegistration.emit(registrationFormGroup.value)"
          data-testid="submit"
          >{{ 'sign-up' | transloco }}</ion-button
        >

        @if (registrationFormGroup.errors?.['mismatch']) {
          <div class="ion-margin-top">
            <ion-text color="danger">{{
              'password-does-not-match' | transloco
            }}</ion-text>
          </div>
        }
      </form>
    </div>

    <ta-password-validator
      [password$]="registrationFormGroup.controls['password'].valueChanges"
    />
  </ion-content>
</ta-page>
