<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>{{ title() }}</h1>

    @if(!isBase64()) {
    <img
      #imageFromUrl
      src="{{ image() }}"
      alt="Dish"
      [style.display]="'none'"
      crossorigin="anonymous"
    />

    } @let imageFileData = imageFileNew(); @if(imageFileData) {
    <image-cropper
      [imageFile]="imageFileData"
      [allowMoveImage]="true"
      [hideResizeSquares]="false"
      [aspectRatio]="3 / 4"
      backgroundColor="black"
      output="blob"
      format="jpeg"
      (imageCropped)="onImageCropped($event)"
      (loadImageFailed)="onLoadImageFailed()"
    />
    }
    <ion-button
      class="ion-margin-top"
      expand="block"
      (click)="emitCroppedImage()"
      >{{ crop() }}</ion-button
    >
  </ion-content>
</ta-page>
