<ta-page
  [showHeaderMenu]="true"
  [showLanguages]="false"
  [showSettingsButton]="true"
  [showMyBites]="true"
  [showMyBucketlists]="true"
  [showFooter]="false"
  [isAuthenticated]="isAuthenticated()"
  [enableBackButton]="true"
  (logoutClick)="logoutClick.emit()"
  (gotoSettings)="gotoSettings.emit()"
  (gotoMyBucketlists)="gotoMyBucketlists.emit()"
  (gotoMyBites)="gotoMyBites.emit()"
>
  <ion-content>
    <div class="container">
      <bt-map
        readonly
        emitMarkerClick
        [enableZoom]="enableZoom()"
        [geopoints]="positions()"
        [gpsPosition]="gpsPosition()"
        (clickOnMarker)="onGeopointSelection($event)"
      />
      @if (selectedBite) {
        <bt-snap-drawer>
          <h4 class="bite-title">
            {{ selectedBite.name }}
          </h4>
          <bt-bite
            [bite]="selectedBite"
            [userId]="userId()"
            (biteClick)="biteClick.emit($event)"
            (restaurantClick)="restaurantClick.emit($event)"
            (likeButtonClick)="likeButtonClick.emit($event)"
          />
        </bt-snap-drawer>
      }
    </div>
  </ion-content>
</ta-page>
