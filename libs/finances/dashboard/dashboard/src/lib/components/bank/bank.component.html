@if (bank(); as bank) {
<ta-card>
  <ion-card-header>
    <ion-card-subtitle> {{ bank.name }}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <ion-item-group class="ion-margin-top">
      @for (account of bank.accounts; track account.number) {
      <ion-item
        lines="full"
        [button]="true"
        (click)="openAccountDetails.emit(account.number)"
      >
        <ion-label>{{ account.type }} ({{ account.number }})</ion-label>
        <ion-note slot="end">{{ account.balance }} $</ion-note>
      </ion-item>
      }
    </ion-item-group>
  </ion-card-content>
</ta-card>
}
