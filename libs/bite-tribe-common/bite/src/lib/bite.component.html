@let biteData = bite();

<ion-card>
  <div class="card-content">
    <div class="card-image">
      <img
        alt="Dish"
        src="{{ biteData.imagePath || biteData?.image }}"
        height="500"
        loading="lazy"
        (click)="biteClick.emit(biteData)"
      />
    </div>

    <div class="card-details">
      <ion-card-header>
        <ion-card-subtitle
          class="restaurant-name"
          (click)="restaurantClick.emit(biteData)"
        >
          <ion-text color="secondary">
            {{ biteData?.place }}
          </ion-text>

          <div class="distance-container">
            <ion-icon name="footsteps-outline" color="secondary" size="large" />
            <ion-text color="secondary">{{
              biteData?.distance | toMetric
            }}</ion-text>
          </div>
        </ion-card-subtitle>

        <ion-card-title
          class="ion-padding-bottom"
          (click)="biteClick.emit(biteData)"
        >
          <span class="bite-title">
            <ion-text color="secondary">
              {{ biteData?.name | withFirstLetterUpperCase }}
            </ion-text>
          </span>
        </ion-card-title>
      </ion-card-header>

      <ion-card-content [class.with-edit]="showEditButton()">
        <div class="rating-container ion-margin-vertical">
          @if (biteData?.rating) {
          <star-rating [rating]="biteData?.rating" readOnly />
          }
        </div>

        @if (!showEditButton()) {
        <bt-likes
          class="ion-margin-top"
          [bite]="biteData"
          [userId]="userId()"
          [inCard]="true"
          (likeButtonClick)="likeButtonClick.emit($event)"
        />
        } @if (showEditButton()) {
        <div class="bite-actions">
          <ion-button (click)="gotoEdit.emit(biteData)"> Edit</ion-button>
          <ion-button
            color="danger"
            fill="outline"
            expand="block"
            (click)="openConfirmationDialog()"
          >
            Delete
          </ion-button>
        </div>
        }
      </ion-card-content>
    </div>
  </div>
</ion-card>

<ion-alert
  [isOpen]="isOpen()"
  header="Delete Bite"
  message="Are you sure you want to delete this bite?"
  [buttons]="confirmationButtons"
  (didDismiss)="handleConfirmationDismiss($event)"
/>
