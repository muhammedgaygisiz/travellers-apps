@let categoryData = linkedCategory();

<div class="menu-category ion-padding">
  <h2>{{ categoryData?.title }}</h2>
  @if (categoryData?.subtitle) {
    <p class="subtitle">{{ categoryData?.subtitle }}</p>
  }
  @if (categoryData?.items?.length) {
    <ion-reorder-group [disabled]="false">
      @for (item of categoryData?.items; track item.name) {
        <div class="menu-item">
          <menu-item
            [item]="item"
            (createBiteClick)="createBiteClick.emit($event)"
          />
        </div>
      }
    </ion-reorder-group>
  } @else {
    <div class="menu-placeholder">
      <p>No items in this category yet.</p>
    </div>
  }
</div>
