<ta-page
  [chrome]="{
    enableBackButton: true,
    showHeaderMenu: false,
    showFooter: false,
  }"
  [isAuthenticated]="isAuthenticated()"
  (logoutClick)="logoutClick.emit()"
>
  <ion-content>
    <div class="container">
      <bt-map
        readonly
        emitMarkerClick
        [enableZoom]="enableZoom()"
        [geopoints]="positions()"
        [gpsPosition]="gpsPosition()"
        (clickOnMarker)="onGeopointSelection($event)"
      />
      @if (showMyPositionButton()) {
        <ion-fab
          class="my-position-fab"
          slot="fixed"
          vertical="bottom"
          horizontal="end"
        >
          <ion-fab-button
            data-testid="btn-my-position"
            color="light"
            [attr.aria-label]="'my-position' | transloco"
            (click)="onMyPositionClick()"
          >
            <ion-icon name="locate-outline" />
          </ion-fab-button>
        </ion-fab>
      }
      @if (selectedBite(); as bite) {
        <bt-snap-drawer>
          <h4 class="bite-title">
            {{ bite.name }}
          </h4>
          <bt-bite
            [bite]="bite"
            [userId]="userId()"
            (biteClick)="biteClick.emit($event)"
            (likeButtonClick)="likeButtonClick.emit($event)"
          />
        </bt-snap-drawer>
      }
    </div>
  </ion-content>
</ta-page>
