<ta-page [showAddButton]="false" [enableBackButton]="true">
  <ta-card>
    <ion-card-header>
      <ion-card-subtitle> Bank Details </ion-card-subtitle>
    </ion-card-header>

    <div class="ion-padding">
      <form [formGroup]="addBankFormGroup">
        <ion-item lines="full">
          <ion-input
            formControlName="name"
            inputmode="text"
            label="Name"
            labelPlacement="floating"
          />
        </ion-item>

        <ion-button
          class="ion-margin-top"
          expand="block"
          [disabled]="!addBankFormGroup.valid"
          (click)="submitNewBank.emit(addBankFormGroup.value)"
        >
          Save
        </ion-button>
      </form>
    </div>
  </ta-card>
</ta-page>
