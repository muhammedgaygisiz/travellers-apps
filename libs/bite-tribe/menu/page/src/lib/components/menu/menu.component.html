@let menuData = linkedMenu();

<div class="menu-container">
  @if (menuData?.categories?.length) {
    <ion-reorder-group [disabled]="true">
      @for (category of menuData?.categories; track category.id) {
        <div class="menu-item">
          <category
            [category]="category"
            [currency]="currency()"
            [canCreateBite]="canCreateBite()"
            [canAddToCart]="canAddToCart()"
            (createBiteClick)="createBiteClick.emit($event)"
            (addToCartClick)="addToCartClick.emit($event)"
          />
        </div>
      }
    </ion-reorder-group>
  } @else {
    <div class="menu-placeholder">
      <p>{{ 'no-menu-yet' | transloco }}</p>
    </div>
  }
</div>
