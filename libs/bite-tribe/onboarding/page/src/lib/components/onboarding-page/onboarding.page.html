<ta-page
  [chrome]="{
    enableBackButton: false,
    showHeaderMenu: false,
    showFooter: false,
  }"
>
  <div class="onboarding-shell">
    <header class="onboarding-shell__progress">
      <p class="onboarding-shell__step-count">
        {{ 'onboarding-progress' | transloco: { current: stepNumber(), total:
        stepCount() } }}
      </p>

      <h1 class="onboarding-shell__title">
        {{ currentStep().titleKey | transloco }}
      </h1>

      <ion-progress-bar
        [value]="progress()"
        data-testid="onboarding-progress"
      />
    </header>

    <section class="onboarding-shell__content">
      <ng-content />
    </section>

    <footer class="onboarding-shell__nav">
      @if (!isFirstStep()) {
      <ion-button
        fill="outline"
        data-testid="onboarding-back"
        (click)="back.emit()"
      >
        {{ 'onboarding-back' | transloco }}
      </ion-button>
      }

      <ion-button
        class="onboarding-shell__next"
        data-testid="onboarding-next"
        [disabled]="!canAdvance()"
        (click)="next.emit()"
      >
        {{ (isLastStep() ? 'onboarding-finish' : 'onboarding-next') | transloco
        }}
      </ion-button>
    </footer>
  </div>
</ta-page>
