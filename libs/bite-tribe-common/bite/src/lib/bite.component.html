@let biteData = bite();

<ion-card>
  <div class="card-content">
    <div class="card-image">
      <img alt="Dish" [src]="biteData?.image | toBlobUrl" loading="lazy" />
    </div>
    <div class="card-details">
      <ion-card-header>
        <ion-card-subtitle
          class="restaurant-name"
          (click)="restaurantClick.emit(biteData)"
          >{{ biteData?.place }}
        </ion-card-subtitle>

        <ion-card-title
          class="link-title ion-padding-bottom"
          (click)="biteClick.emit(biteData)"
        >
          <span class="bite-title">
            {{ biteData?.name }}
          </span>
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-text
          color="primary {{ showEditButton() ? 'ion-margin-bottom' : '' }}"
          >{{ biteData?.distance | toMetric }}</ion-text
        >
        @if (!showEditButton()) {
        <bt-likes
          class="ion-margin-top"
          [bite]="biteData"
          [userId]="userId()"
          (likeButtonClick)="likeButtonClick.emit($event)"
        />
        } @if (showEditButton()) {
        <div class="bite-actions">
          <ion-button (click)="gotoEdit.emit(biteData)"> Edit </ion-button>
          <ion-button
            color="danger"
            fill="outline"
            expand="block"
            (click)="onDeleteBiteClick(biteData)"
          >
            Delete
          </ion-button>
        </div>
        }
      </ion-card-content>
    </div>
  </div>
</ion-card>
