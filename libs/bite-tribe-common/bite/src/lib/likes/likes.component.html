@let biteData = bite();

<div class="like-container {{ inCard() ? 'in-card' : '' }}">
  <ion-chip class="{{ calcClass() }}" (click)="openLikeOptions($event)">
    @if (biteData?.likes?.length) { @for (emoji of getLikeEmojis(); let index =
    $index; track index) {
    <ion-label class="emoji">{{ emoji }}</ion-label>
    }
    <ion-label class="like-nr">{{ biteData.likes?.length }}</ion-label>
    } @else {
    <ion-label class="ion-margin-horizontal">👍</ion-label>
    }
  </ion-chip>
</div>
