<ta-page
  [showHeaderMenu]="showHeaderMenu()"
  [showLanguages]="false"
  [showAddButton]="showAddButton()"
  [showSettingsButton]="true"
  [showMyBites]="true"
  [showMyBucketlists]="true"
  [enableBackButton]="enableBackButton()"
  [showFooter]="showFooter()"
  [isAuthenticated]="isAuthenticated()"
  (logoutClick)="logoutClick.emit()"
  (addButtonClick)="addButtonClick.emit()"
  (gotoSettings)="gotoSettings.emit()"
  (gotoMyBucketlists)="gotoMyBucketlists.emit()"
  (gotoMyBites)="gotoMyBites.emit()"
>
  <ion-content class="ion-padding">
    <h1>{{ title() }}</h1>

    <div class="chip-container">
      <ion-chip>Map View</ion-chip>
      <ion-chip>Nearby</ion-chip>
      <ion-chip>Vegan</ion-chip>
    </div>

    <ng-container
      *ngTemplateOutlet="
        showSpinner() ? withLoadingTemplate : withoutLoadingTemplate
      "
    />
  </ion-content>
</ta-page>

<ng-template #withLoadingTemplate>
  @defer (when !isBitesLoading()) {
  <ng-container *ngTemplateOutlet="withoutLoadingTemplate" />
  } @placeholder (minimum 1000ms) {
  <div class="spinner-container">
    <ion-spinner color="primary" />
  </div>
  }
</ng-template>

<ng-template #withoutLoadingTemplate>
  @if (!bites()?.length) {
  <ion-card>
    <ion-card-content>
      <ion-text color="primary"> No bites found. Be the first one.</ion-text>
    </ion-card-content>
  </ion-card>
  } @for (bite of bites(); track bite.id) {
  <bt-bite
    [bite]="bite"
    [userId]="userId()"
    [showEditButton]="editableBites()"
    (biteClick)="biteClick.emit($event)"
    (restaurantClick)="restaurantClick.emit($event)"
    (likeButtonClick)="likeButtonClick.emit($event)"
    (gotoEdit)="gotoEdit.emit($event)"
    (deleteBite)="deleteBite.emit($event)"
  />
  }
</ng-template>
