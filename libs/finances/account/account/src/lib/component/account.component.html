@let payments = account()?.payments;

<ta-page
  [enableBackButton]="true"
  [showAddButton]="true"
  (showAddPopover)="showAddPopover($event)"
>
  <ta-card>
    <ion-card-header>
      <ion-card-title>{{ account()?.balance }} $</ion-card-title>
      <ion-card-subtitle> Account Details</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item-group>
        @for (payment of payments; track payment.id) {
        <ion-item lines="full" (click)="paymentClicked.emit(payment)">
          <ion-label>{{ payment.amount }} $</ion-label>
          <ion-note slot="end">{{ payment.date | date }}</ion-note>
        </ion-item>
        }
      </ion-item-group>
    </ion-card-content>
  </ta-card>

  @if (payments) {
  <ta-card>
    <ion-card-content>
      <ta-chart [data]="payments" />
    </ion-card-content>
  </ta-card>
  }
</ta-page>
