<ta-page
  [showHeaderMenu]="false"
  [enableBackButton]="true"
  [showFooter]="false"
>
  <ion-content class="ion-padding">
    <h1 class="ion-margin-bottom">Settings</h1>

    <!-- Subscription Tier Section -->
    <section class="subscription-section ion-margin-bottom">
      <h2>Account Type</h2>
      <div class="subscription-cards">
        <ta-card
          [class.highlighted]="isFreeUser()"
          [attr.aria-label]="'Free tier'"
          [attr.aria-current]="isFreeUser() ? 'true' : null"
          role="status"
        >
          <ion-card-header>
            <ion-card-title>Free</ion-card-title>
          </ion-card-header>
        </ta-card>
        <ta-card
          [class.highlighted]="isProUser()"
          [attr.aria-label]="'PRO tier'"
          [attr.aria-current]="isProUser() ? 'true' : null"
          role="status"
        >
          <ion-card-header>
            <ion-card-title>PRO</ion-card-title>
          </ion-card-header>
        </ta-card>
      </div>
    </section>

    <div>
      <form [formGroup]="settingsForm">
        <section class="settings-section">
          <ion-item>
            <ion-label>Push Notifications</ion-label>
            <ion-toggle slot="end" formControlName="pushNotifications" />
          </ion-item>
          <ion-item>
            <ion-label>Email Updates</ion-label>
            <ion-toggle slot="end" formControlName="emailUpdates" />
          </ion-item>
          <ion-item>
            <ion-label>Theme</ion-label>
            <ion-select
              slot="end"
              placeholder="Light"
              interface="popover"
              formControlName="theme"
              (ionChange)="onThemeChange($event)"
            >
              <ion-select-option value="light">Light</ion-select-option>
              <ion-select-option value="dark">Dark</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-item id="currency-selector-trigger">
            <ion-label>Preferred Currency</ion-label>
            <ion-text slot="end">{{ selectedCurrencyName() }}</ion-text>
          </ion-item>
          <ion-item>
            <ion-label>Nearby Distance (meters)</ion-label>
            <ion-input
              slot="end"
              type="number"
              min="1"
              formControlName="nearby"
              placeholder="2000"
              class="nearby-value"
            />
          </ion-item>
        </section>

        <div class="button-container safe-padding-bottom">
          <ion-button fill="outline" color="medium">Log Out</ion-button>
          <ion-button
            [disabled]="!settingsForm.valid || settingsForm.pristine"
            (click)="saveSettings()"
          >
            Save Changes
          </ion-button>
        </div>
      </form>
    </div>
  </ion-content>
</ta-page>

<ion-modal trigger="currency-selector-trigger" #currencyModal>
  <ng-template>
    <currency-selector
      class="ion-page"
      [selectedCurrency]="settingsForm.get('currency')?.value || 'EUR'"
      (currencySelected)="onCurrencySelected($event, currencyModal)"
      (selectionCancel)="currencyModal.dismiss()"
    />
  </ng-template>
</ion-modal>
