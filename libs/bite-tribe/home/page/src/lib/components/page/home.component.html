<ta-page
  [showHeaderMenu]="false"
  [showAddButton]="true"
  (addButtonClick)="onAddButtonClicked()"
>
  <ion-content class="ion-padding">
    <h1>Bites</h1>

    <div class="chip-container">
      <ion-chip>Map View</ion-chip>
      <ion-chip>Nearby</ion-chip>
      <ion-chip>Vegan</ion-chip>
    </div>

    @for (bite of bites(); track bite.id) {
    <bt-bite [bite]="bite" />
    }
  </ion-content>
</ta-page>
