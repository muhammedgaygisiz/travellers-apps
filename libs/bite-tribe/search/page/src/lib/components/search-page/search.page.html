<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>{{ 'search' | transloco }}</h1>

    <ion-searchbar
      [debounce]="1000"
      [placeholder]="'search' | transloco"
      (ionInput)="searchbarInput($event)"
    />

    <bt-chip-radio-group
      class="ion-margin-vertical"
      data-cy="search-categories"
      [options]="categoryOptions()"
      [selectedValue]="selectedCategory()"
      (valueChange)="categoryValueChange($event)"
    />

    <search-list
      [results]="results()"
      [isLoading]="isLoading()"
      [hasSearched]="hasSearched()"
      (resultClick)="resultClick.emit($event)"
    />
  </ion-content>
</ta-page>
