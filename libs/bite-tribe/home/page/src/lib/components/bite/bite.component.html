@let biteData = bite();

<div class="container">
  <div class="bite-container">
    <ion-card>
      <div class="card-content">
        <div class="card-image">
          <img alt="Dish" [src]="biteData?.image" />
        </div>
        <div class="card-details">
          <ion-card-header>
            <ion-card-subtitle
              class="restaurant-name"
              (click)="restaurantClick.emit(biteData)"
              >{{ biteData?.place }}</ion-card-subtitle
            >
            <ion-card-title
              class="bite-name ion-padding-bottom"
              (click)="biteClick.emit(biteData)"
              >{{ biteData?.name }}
            </ion-card-title>
          </ion-card-header>

          <ion-card-content>
            {{ biteData?.distance | toMetric }}
            <div class="like-container ion-padding-top">
              <ion-chip
                class="{{ calcClass() }}"
                (click)="openLikeOptions($event)"
              >
                @if (biteData?.likes?.length) { @for (emoji of getLikeEmojis();
                track emoji) {
                <ion-label class="ion-margin-end">{{ emoji }}</ion-label>
                }
                <ion-badge>{{ biteData.likes?.length }}</ion-badge>
                } @else {
                <ion-label>👍</ion-label>
                }
              </ion-chip>
            </div>
          </ion-card-content>
        </div>
      </div>
    </ion-card>
  </div>
</div>
