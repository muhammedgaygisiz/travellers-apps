@if (isWeb()) {
  <input
    type="file"
    #fileUploader
    class="ion-hide"
    (change)="onFileSelected($event)"
    data-testid="image-file-input"
  />
}

@if (isLoading()) {
  <div class="image-processing" role="status" data-testid="image-processing">
    <ion-spinner
      name="crescent"
      [attr.aria-label]="'image-upload-processing' | transloco"
    />
  </div>
} @else if (showImage()) {
  <div class="image-preview" [class.is-pending]="isImagePending()">
    <img
      [src]="imageSource()"
      [alt]="'image-upload-preview-alt' | transloco"
      (load)="onImageLoad()"
      (error)="onImageError()"
    />
    <div class="image-actions-overlay">
      <ion-button
        id="edit-button"
        fill="solid"
        [attr.aria-label]="'image-upload-edit' | transloco"
      >
        <ion-icon name="crop-outline" />
      </ion-button>
      <ion-button
        id="delete-button"
        fill="solid"
        [attr.aria-label]="'image-upload-delete' | transloco"
        (click)="clearImage()"
      >
        <ion-icon name="trash-outline" />
      </ion-button>
    </div>
    @if (isImagePending()) {
      <!-- Covers the img, and the actions with it, until the img has decoded.
      The img stays mounted so it can load at all, but it paints nothing until
      then. The actions stay mounted too because #edit-button is the crop
      modal's trigger, which only binds while the element exists. -->
      <div
        class="image-processing image-processing--overlay"
        role="status"
        data-testid="image-pending"
      >
        <ion-spinner
          name="crescent"
          [attr.aria-label]="'image-upload-processing' | transloco"
        />
      </div>
    }
  </div>

  <ion-modal
    trigger="edit-button"
    #cropModal
    [backdropDismiss]="false"
    class="modal"
  >
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancelCropping()">{{
              'cancel' | transloco
            }}</ion-button>
          </ion-buttons>
          <ion-title>{{ 'edit' | transloco }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirmCropping()">{{
              'save' | transloco
            }}</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="edit-image-container">
        @let valueData = value();
        @let imageUrlData = imageUrl();
        <div class="edit-image-container">
          <ion-button fill="outline" (click)="rotateImage()">
            {{ 'image-upload-rotate' | transloco }}
          </ion-button>
          <image-cropper
            [imageBase64]="valueData ? valueData : undefined"
            [imageURL]="imageUrlData ? imageUrlData : undefined"
            [allowMoveImage]="true"
            [hideResizeSquares]="false"
            [aspectRatio]="3 / 4"
            [canvasRotation]="canvasRotation()"
            output="base64"
            backgroundColor="black"
            format="jpeg"
            (imageCropped)="onImageCrop($event)"
          />
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
} @else {
  <ion-card
    class="image-placeholder"
    [class.isDisabled]="disabled()"
    (click)="onImageUploadClick()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <ion-card-content>
      <placeholder [isDragging]="isDragging()" [disabled]="disabled()" />
    </ion-card-content>
  </ion-card>
}
