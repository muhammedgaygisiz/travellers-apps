@let starIconPath = '/assets/custom-icons/star.svg';

@if (label()) {
  <div class="ion-margin-vertical">
    <ion-label>{{ label() }}</ion-label>
  </div>
}

<div class="star-rating" role="radiogroup" [attr.aria-label]="label()">
  @for (star of stars; track star) {
    <ion-icon
      [src]="starIconPath"
      [class]="(star | isFilled: hoveredIndex() : getRating()) ? 'filled' : ''"
      size="large"
      role="radio"
      [attr.aria-checked]="getRating() === star"
      [attr.aria-label]="star + ' star'"
      [attr.tabindex]="readonly() ? null : 0"
      (click)="onRate(star)"
      (keydown.enter)="onRate(star)"
      (keydown.space)="onRate(star); $event.preventDefault()"
      (mouseover)="onHover(star)"
      (focus)="onHover(star)"
      (mouseleave)="onLeave()"
      (blur)="onLeave()"
      [class.read-only]="readonly()"
    />
  }
</div>
