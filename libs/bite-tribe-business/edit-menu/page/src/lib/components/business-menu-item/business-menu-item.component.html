@let itemData = item();
@let isVariantData = isVariant();

<div class="menu-item">
  <div class="item-container">
    <business-menu-variant [item]="itemData" (addItem)="onAddVariant($event)" />
    @if (itemData?.variants?.length) {
      <div class="ion-margin-top">
        @for (variant of itemData?.variants; track $index) {
          <business-menu-variant [item]="variant" isVariant />
        }
      </div>
    }
  </div>
  @if (shouldShowAddVariant()) {
    <business-menu-variant (addItem)="onAddVariant($event)" />
  }
  @if (!isVariantData) {
    <ion-button
      expand="block"
      class="ion-margin-top"
      (click)="onAddVariantClick()"
    >
      Add Variant
    </ion-button>
  }
</div>
