<form class="category-editor" [formGroup]="form" (ngSubmit)="saveCategory()">
  <header class="editor-header">
    <h2 data-testid="category-editor-title">
      {{
        category()
          ? form.controls.title.value || category()?.title
          : ('menu-category-new' | transloco)
      }}
    </h2>
    <ion-button
      fill="clear"
      [attr.aria-label]="'cancel' | transloco"
      data-testid="close-category"
      (click)="cancelEdit.emit()"
    >
      <ion-icon slot="icon-only" name="close-outline" aria-hidden="true" />
    </ion-button>
  </header>

  <ion-input
    formControlName="title"
    fill="outline"
    mode="md"
    labelPlacement="stacked"
    [label]="'menu-category-title' | transloco"
    data-testid="category-title"
  />
  <ion-input
    formControlName="subtitle"
    fill="outline"
    mode="md"
    labelPlacement="stacked"
    [label]="'menu-category-subtitle' | transloco"
    data-testid="category-subtitle"
  />
</form>

@if (category()) {
  <!--
    A draft until the category's Save, like the fields above (issue #2258).
  -->
  <business-category-extras
    class="extras"
    [extrasBlock]="extrasDraft()"
    [currencySymbol]="currency() ?? ''"
    (extrasBlockChanged)="extrasDraft.set($event)"
  />
}

<!--
  Below the extras (issue #2278): since #2258 this Save writes them too, and
  a Save above the box was out of sight once the owner had scrolled to an
  extra. Outside the form, so Enter in an extra's field submits nothing.
-->
<div class="actions">
  @if (category()) {
    <ion-button
      class="delete"
      fill="clear"
      color="danger"
      data-testid="delete-category"
      (click)="confirmDelete()"
    >
      {{ 'menu-category-delete' | transloco }}
    </ion-button>
  }
  <ion-button
    fill="outline"
    data-testid="cancel-category"
    (click)="cancelEdit.emit()"
  >
    {{ 'cancel' | transloco }}
  </ion-button>
  <ion-button
    data-testid="save-category"
    [disabled]="!canSave()"
    (click)="saveCategory()"
  >
    {{ 'save' | transloco }}
  </ion-button>
</div>
