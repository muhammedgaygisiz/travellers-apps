<ta-page
  [showHeaderMenu]="false"
  [enableBackButton]="true"
  [showAddButton]="false"
  [hideAuthButton]="true"
  [showFooter]="false"
>
  <ta-card>
    <div class="ion-padding">
      <div class="ion-margin-top ion-margin-bottom separator">
        <ion-text> Sign in with your </ion-text>
      </div>

      <div class="registration-options">
        <ion-button fill="outline" (click)="onGoogleSignUp()">
          <ion-icon name="logo-google" color="secondary" />
        </ion-button>
        <ion-button fill="outline" (click)="onAppleSignUp()">
          <ion-icon name="logo-apple" color="secondary" />
        </ion-button>
        <ion-button
          fill="outline"
          (click)="onFacebookSignUp()"
          [disabled]="true"
        >
          <ion-icon name="logo-facebook" color="secondary" />
        </ion-button>
      </div>

      <div class="ion-margin-top separator ion-margin-bottom">
        <ion-text> Account or with your Email </ion-text>
      </div>

      <form [formGroup]="authFormGroup">
        <ion-item lines="full">
          <ion-input
            autocomplete="email"
            inputmode="email"
            formControlName="email"
            data-cy="email"
            label="Email"
            labelPlacement="floating"
          />
        </ion-item>

        <ion-item lines="full">
          <ion-input
            type="password"
            formControlName="password"
            data-cy="password"
            label="Password"
            labelPlacement="floating"
          >
            <ion-input-password-toggle slot="end" />
          </ion-input>
        </ion-item>

        <ion-button
          class="ion-margin-top"
          expand="block"
          [disabled]="!authFormGroup.valid"
          (click)="submitAuth.emit(authFormGroup.value)"
          data-cy="submit"
          >Log In
        </ion-button>

        @if (loginFailed()) {
        <div class="ion-margin-top">
          <ion-text color="danger">
            Something went wrong. Please try again.
          </ion-text>
        </div>
        }
      </form>
    </div>
  </ta-card>

  <ta-card>
    <div class="ion-margin">
      <ion-text> If you don't have an account already sign up now. </ion-text>

      <ion-button
        fill="outline"
        class="ion-margin-top"
        expand="block"
        (click)="signup.emit()"
        data-cy="signup"
      >
        Sign up
      </ion-button>
    </div>
  </ta-card>
</ta-page>
