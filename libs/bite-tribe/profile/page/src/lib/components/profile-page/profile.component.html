<ta-page
  [showHeaderMenu]="true"
  [showLanguages]="false"
  [showSettingsButton]="true"
  [showMyBites]="true"
  [showMyBucketlists]="true"
  [showFooter]="false"
  [isAuthenticated]="isAuthenticated()"
  [enableBackButton]="true"
  (logoutClick)="logoutClick.emit()"
  (gotoSettings)="gotoSettings.emit()"
  (gotoMyBucketlists)="gotoMyBucketlists.emit()"
  (gotoMyBites)="gotoMyBites.emit()"
>
  <ion-content class="ion-padding">
    <div class="profile-container">
      <ion-avatar class="profile-avatar">
        <img src="assets/images/users/lisa.jpg" alt="Lisa Davis" />
      </ion-avatar>

      <h1 class="profile-name">Lisa Davis</h1>

      <p class="profile-location">San Francisco, CA</p>

      <ion-button expand="block" class="follow-button">Follow</ion-button>

      <div class="about-section">
        <h2>About</h2>
        <p>
          Home cook and food enthusiast. Love exploring new recipes and sharing
          meals with friends.
        </p>
      </div>

      <div class="meals-section">
        <h2>10 Meals</h2>
      </div>
    </div>
  </ion-content>
</ta-page>
