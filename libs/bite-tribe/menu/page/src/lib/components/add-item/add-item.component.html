<ion-list>
  <form [formGroup]="newItemForm">
    <ion-item>
      <ion-input label="Name" formControlName="name" />
    </ion-item>
    <ion-item>
      <ion-input label="Description" formControlName="description" />
    </ion-item>
    <ion-item>
      <ion-input
        type="number"
        value=""
        inputmode="decimal"
        label="Price"
        formControlName="price"
      />
    </ion-item>
  </form>

  <ion-button
    class="ion-margin-top"
    [disabled]="isInvalid()"
    (click)="onAddCategory()"
  >
    Add item
  </ion-button>
  <ion-button (click)="cancelAddItem.emit()" class="ion-margin-top">
    Cancel
  </ion-button>
</ion-list>
