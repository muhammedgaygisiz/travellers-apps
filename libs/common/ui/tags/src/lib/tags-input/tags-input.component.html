{{ tagInputValueChanges$ | async }}
@let readonlyData = readonly();

<label id="tags-label" class="ion-margin-bottom">{{
  readonly() ? ('tags' | transloco) : ('tags-label' | transloco)
}}</label>

<div class="container">
  <!-- Do not move to label attr of ion-input since it causes wrong positioning of the label -->
  @for (tag of tags(); track tag) {
    <bt-chip
      [label]="tag"
      [removable]="!readonlyData"
      (removeClick)="removeTag(tag)"
    />
  }
  @if (!readonlyData) {
    <ng-container [formGroup]="formGroup">
      <ion-input
        aria-labelledby="tags-label"
        formControlName="tagInput"
        fill="outline"
        mode="md"
      />
    </ng-container>
  }
</div>

@if (!readonlyData && suggestedTags().length > 0) {
  <div class="suggestions-container ion-margin-top">
    <label class="suggestions-label">Suggested Tags:</label>
    <div class="suggestions">
      @for (suggestedTag of suggestedTags(); track suggestedTag) {
        @if (!tags().includes(suggestedTag)) {
          <bt-chip
            [label]="suggestedTag"
            icon="add-circle-outline"
            class="suggestion"
            (chipClick)="addSuggestedTag(suggestedTag)"
          />
        }
      }
    </div>
  </div>
}
