<div class="star-rating">
  <ion-icon
    [name]="
      (1 | isFilled : hoveredIndex() : getRating()) ? 'star' : 'star-outline'
    "
    size="large"
    (click)="onRate(1)"
    (mouseover)="onHover(1)"
    (mouseleave)="onLeave()"
    [class.read-only]="readonly()"
  />

  <ion-icon
    [name]="
      (2 | isFilled : hoveredIndex() : getRating()) ? 'star' : 'star-outline'
