<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>My Bucketlists</h1>

    <ion-list lines="full">
      @for (bucketlist of bucketlists(); track bucketlist.id) {
      <ion-item
        [button]="true"
        (click)="gotoBucketlistDetails.emit(bucketlist.id)"
      >
        <ion-icon name="bookmark" slot="start" />
        <ion-label>{{bucketlist.name}}</ion-label>
        <ion-badge>{{bucketlist.biteIds | count}}</ion-badge>
      </ion-item>
      }
    </ion-list>

    <div class="ion-margin-top ion-text-end end-of-page actions">
      <ion-button expand="block" id="preset-new-list-alert"
        >Create new bucket list</ion-button
      >
      <ion-alert
        trigger="preset-new-list-alert"
        header="Please enter a name for your new list"
        [inputs]="newListInputs"
        [buttons]="saveButton"
      />
    </div>
  </ion-content>
</ta-page>
