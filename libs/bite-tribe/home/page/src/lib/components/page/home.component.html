<ta-page
  [showHeaderMenu]="true"
  [showLanguages]="false"
  [showAddButton]="showAddButton()"
  [showSettingsButton]="true"
  [showMyBites]="true"
  [showMyBucketlists]="true"
  [enableBackButton]="enableBackButton()"
  [showFooter]="showFooter()"
  (logoutClick)="logoutClick.emit()"
  (addButtonClick)="addButtonClick.emit()"
  (gotoSettings)="gotoSettings.emit()"
  (gotoMyBucketlists)="gotoMyBucketlists.emit()"
  (gotoMyBites)="gotoMyBites.emit()"
>
  <ion-content class="ion-padding">
    <h1>{{ title() }}</h1>

    <div class="chip-container">
      <ion-chip>Map View</ion-chip>
      <ion-chip>Nearby</ion-chip>
      <ion-chip>Vegan</ion-chip>
    </div>

    @if (!bites()?.length) {
    <ion-card>
      <ion-card-content>
        <ion-text color="primary"> No bites found. Be the first one. </ion-text>
      </ion-card-content>
    </ion-card>
    }

    <cdk-virtual-scroll-viewport autosize minBufferPx="900" maxBufferPx="1800">
      <bt-bite
        *cdkVirtualFor="let bite of bites(); trackBy: trackByBite"
        [bite]="bite"
        [userId]="userId()"
        [showEditButton]="editableBites()"
        (biteClick)="biteClick.emit($event)"
        (restaurantClick)="restaurantClick.emit($event)"
        (likeButtonClick)="likeButtonClick.emit($event)"
        (gotoEdit)="gotoEdit.emit($event)"
      />
    </cdk-virtual-scroll-viewport>
  </ion-content>
</ta-page>
