name: BiteTribe CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      nx_verbose_logging:
        description: 'NX Verbose Logging'
        required: false
        default: 'false'
        type: boolean

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NX_DAEMON: false
  NX_VERBOSE_LOGGING: ${{ github.event.inputs.nx_verbose_logging }}
  NX_BASE: develop
  # Now that the cache index is persisted (see .github/actions/nx-cache),
  # .nx/cache accumulates across runs instead of being rebuilt every time. Nx
  # would otherwise size it against free disk on the runner; cap it so the
  # uploaded cache entry stays well inside the repository's 10 GB budget.
  NX_MAX_CACHE_SIZE: 1GB

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Setup action
        uses: ./.github/actions/setup

  lint:
    runs-on: ubuntu-latest
    needs:
      - setup

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      - name: 'Setup env'
        uses: ./.github/actions/setup-env-for-affected

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Run Linter
        run: npm run nx -- affected -t lint

      # Structural checks for the SSOT: dead relative links, leftover Logseq syntax,
      # issue numbers that do not link, and the use-case format rules.
      # See ssot/overview/use-case-format.md.
      #
      # BLOCKING: a violation fails the job and therefore the pipeline. The report still
      # goes to the job summary and, on a pull request, to a comment - which GitHub turns
      # into an email through normal notification settings - because the reporting step
      # runs with `if: always()`.
      - name: Check SSOT
        id: ssot
        run: npm run check:ssot --silent > ssot-report.txt 2>&1

      - name: Report SSOT findings
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const { existsSync, readFileSync } = require('node:fs');
            const outcome = '${{ steps.ssot.outcome }}';
            if (outcome !== 'success' && outcome !== 'failure') return; // step never ran
            const report = existsSync('ssot-report.txt')
              ? readFileSync('ssot-report.txt', 'utf8').trim()
              : '(no report produced)';
            const failed = outcome === 'failure';
            const heading = failed ? '### SSOT check found problems' : '### SSOT check passed';

            await core.summary.addRaw(`${heading}\n\n\`\`\`\n${report}\n\`\`\`\n`).write();

            if (context.eventName !== 'pull_request') {
              if (failed) core.error(`SSOT check found problems:\n${report}`);
              return;
            }

            const marker = '<!-- ssot-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (!failed) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: `${marker}\n${heading}\n`,
                });
              }

              return;
            }

            const body = [
              marker,
              heading,
              '',
              'This blocks the merge. Fix it in this pull request.',
              '',
              '```',
              report,
              '```',
              '',
              'Run `npm run check:ssot` locally; the rules are in [tools/README.md](https://github.com/muhammedgaygisiz/travellers-apps/blob/develop/tools/README.md).',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  stylelint:
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      - name: 'Setup env'
        uses: ./.github/actions/setup-env-for-affected

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Run Stylelint
        run: npm run nx -- affected -t stylelint

  tests:
    runs-on: ubuntu-latest
    needs:
      - stylelint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      - name: 'Setup env'
        uses: ./.github/actions/setup-env-for-affected

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Run Unit Tests
        run: npm run nx -- affected -t test --coverage --coverageReporters=cobertura

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          directory: ./coverage # optional
          flags: unittests # optional
          name: codecov-umbrella # optional
          fail_ci_if_error: false # optional (default = false)
          verbose: false # optional (default = false)

  # Loki is split over three jobs so the two configurations in loki.config.js
  # capture on separate runners (issue #1816). `loki-build` builds Storybook once
  # and hands it to both capture legs as an artifact, and `loki` folds the legs
  # back into the single result that `report` and the Storybook deploy read.
  loki-build:
    runs-on: ubuntu-latest
    needs:
      - tests
    outputs:
      storybook: ${{ steps.affected.outputs.storybook }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      - name: 'Setup env'
        uses: ./.github/actions/setup-env-for-affected

      # Skip the capture when no story can have changed. This is read from the
      # project graph, not from path filters: storybook-host depends on every
      # app and library a story renders, and its `loki` target declares the
      # files outside any project that a capture reads (references, the Loki
      # runner and config, the brand characters, package.json). A skipped
      # capture leaves the jobs green, so `report` passes.
      # The two commands run outside a condition on purpose: if Nx fails, the
      # step fails, rather than reading the failure as "not affected".
      - name: Check whether a story is affected
        id: affected
        shell: bash
        run: |
          affected=$(npm run --silent nx -- show projects --affected --json)
          storybook=$(jq 'index("storybook-host") != null' <<< "$affected")
          echo "storybook=$storybook" >> "$GITHUB_OUTPUT"
          if [ "$storybook" != 'true' ]; then
            echo 'storybook-host is not affected, so no story can have changed. Loki capture skipped.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The Storybook build reads no NX_APP_* variables, so its artifact is the
      # same in every job and is safe to share through the Nx cache.
      - name: 'Nx cache'
        if: steps.affected.outputs.storybook == 'true'
        uses: ./.github/actions/nx-cache

      # Build the static Storybook (dist/storybook/storybook-host) the same way
      # `npm run loki:update` expects it locally, so captures match the
      # committed references.
      - name: Build Storybook
        if: steps.affected.outputs.storybook == 'true'
        run: npm run build:storybook

      - name: Upload the Storybook build for the capture jobs
        if: steps.affected.outputs.storybook == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: loki-storybook
          path: dist/storybook/storybook-host
          retention-days: 1
          if-no-files-found: error

  # One leg per configuration in loki.config.js. The legs always run, and skip
  # their steps instead, so a pull request with no affected story still reports
  # two green checks rather than two skipped ones.
  loki-capture:
    runs-on: ubuntu-latest
    needs:
      - loki-build
    strategy:
      # Both legs finish even when one finds a diff, so a pull request sees
      # every changed reference in one run.
      fail-fast: false
      matrix:
        configuration:
          - chrome.laptop
          - chrome.iphone7

    steps:
      - name: Checkout repository
        if: needs.loki-build.outputs.storybook == 'true'
        uses: actions/checkout@v7

      - name: 'Restore Cache'
        if: needs.loki-build.outputs.storybook == 'true'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        if: needs.loki-build.outputs.storybook == 'true'
        uses: ./.github/actions/install-if-missing

      - name: Download the Storybook build
        if: needs.loki-build.outputs.storybook == 'true'
        uses: actions/download-artifact@v8
        with:
          name: loki-storybook
          path: dist/storybook/storybook-host

      # Loki exits 0 with "No matching configurations" when the filter matches
      # nothing, so a matrix entry that drifts from loki.config.js would pass
      # without capturing. Fail it here instead.
      - name: Check the configuration exists
        if: needs.loki-build.outputs.storybook == 'true'
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: node -e "require('./loki.config.js').configurations[process.env.CONFIGURATION] || (console.error('No Loki configuration ' + process.env.CONFIGURATION), process.exit(1))"

      # Run this configuration's visual-regression suite through the upstream
      # oblador/loki CLI (tools/loki.mjs) against the committed .loki/reference
      # images. Loki drives a headless Chrome inside Docker, which is available
      # on ubuntu-latest. A visual diff fails the leg, and with it `loki`.
      - name: Run Loki visual tests
        if: needs.loki-build.outputs.storybook == 'true'
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: npm run loki:test -- --configurationFilter "^${CONFIGURATION}\$"

      - name: Upload Loki diffs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: loki-diffs-${{ matrix.configuration }}
          path: .loki/difference
          retention-days: 7

  # The single Loki result: green only when the build and both capture legs
  # are. `report` and `deploy-bite-tribe-storybook` read this job, so neither
  # has to know how many configurations there are.
  loki:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - loki-build
      - loki-capture

    steps:
      - name: Require the build and every capture leg to pass
        env:
          BUILD: ${{ needs.loki-build.result }}
          CAPTURE: ${{ needs.loki-capture.result }}
        run: |
          echo "loki-build: $BUILD, loki-capture: $CAPTURE"
          [ "$BUILD" = 'success' ] && [ "$CAPTURE" = 'success' ]

  # The consumer suite runs as three Playwright shards, one runner each
  # (issue #1817). On one worker it took about 7 minutes after the emulators
  # came up. Each shard boots its own emulators from the seeded export, which
  # is why it shards across jobs rather than raising `workers`: the specs share
  # one emulator's data, and several create users, bites and table sessions.
  #
  # Like Loki, the shards report through an aggregate `e2e` job, so `report`
  # and any required check read one name however many shards there are.
  e2e-shard:
    runs-on: ubuntu-latest
    needs:
      - tests
    strategy:
      # Let every shard finish, so one run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      # The Firebase emulators require a JVM; firebase-tools needs JDK 21+.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 'Playwright Chromium'
        uses: ./.github/actions/playwright-chromium

      # Boots the Firebase emulators + Angular dev server (see
      # apps/bite-tribe-e2e/playwright.config.ts) and runs this shard's part of
      # the suite. Playwright splits by test, not by file, because the Nx preset
      # sets `fullyParallel`; every spec seeds what it needs, and the `serial`
      # describes stay in one shard.
      #
      # apps/bite-tribe/.env is gitignored, so these NX_* vars are absent in CI.
      # env-var-plugin.js inlines them into the served bundle at build time.
      # NX_APP_BITE_TRIBE_IS_DEV=true routes the app to the Firebase emulators
      # (and skips App Check); without it the app targets production Firebase and
      # hangs headless. All traffic stays on the local emulators, so the values
      # below only need a matching projectId — the rest are throwaway demo values.
      - name: Run E2E Tests
        run: npm run nx -- e2e bite-tribe-e2e --shard=${{ matrix.shard }}/3
        env:
          NX_APP_BITE_TRIBE_IS_DEV: 'true'
          NX_APP_BITE_TRIBE_PROJECT_ID: bite-tribe
          NX_APP_BITE_TRIBE_API_KEY: demo-api-key
          NX_APP_BITE_TRIBE_AUTH_DOMAIN: bite-tribe.firebaseapp.com
          NX_APP_BITE_TRIBE_STORAGE_BUCKET: bite-tribe.appspot.com
          NX_APP_BITE_TRIBE_MESSAGING_SENDER_ID: '000000000000'
          NX_APP_BITE_TRIBE_APP_ID: demo-app-id

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: dist/.playwright/apps/bite-tribe-e2e
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - e2e-shard

    steps:
      - name: Require every shard to pass
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard: $SHARDS"
          [ "$SHARDS" = 'success' ]

  # Same setup as a consumer `e2e-shard` leg, but its own runner: both suites drive
  # the same Firebase emulator ports and would fight over them in one job.
  business-e2e:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      # The Firebase emulators require a JVM; firebase-tools needs JDK 21+.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 'Playwright Chromium'
        uses: ./.github/actions/playwright-chromium

      # Boots the Firebase emulators + business Angular dev server (see
      # apps/bite-tribe-business-e2e/playwright.config.ts) and runs the suite.
      #
      # Same throwaway emulator configuration as the consumer e2e job; only the
      # auth domain differs, because the business bundle reads
      # NX_APP_BITE_TRIBE_BUSINESS_AUTH_DOMAIN.
      - name: Run Business E2E Tests
        run: npm run nx -- e2e bite-tribe-business-e2e
        env:
          NX_APP_BITE_TRIBE_IS_DEV: 'true'
          NX_APP_BITE_TRIBE_PROJECT_ID: bite-tribe
          NX_APP_BITE_TRIBE_API_KEY: demo-api-key
          NX_APP_BITE_TRIBE_BUSINESS_AUTH_DOMAIN: bite-tribe.firebaseapp.com
          NX_APP_BITE_TRIBE_STORAGE_BUCKET: bite-tribe.appspot.com
          NX_APP_BITE_TRIBE_MESSAGING_SENDER_ID: '000000000000'
          NX_APP_BITE_TRIBE_APP_ID: demo-app-id

      - name: Upload Business Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: business-playwright-report
          path: dist/.playwright/apps/bite-tribe-business-e2e
          retention-days: 7

  # Surfaces the e2e and Loki outcomes on the PR as a single sticky comment.
  # Runs after all of them regardless of their result so a failure is still
  # reported.
  report:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs:
      - e2e
      - business-e2e
      - loki

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Post e2e and Loki results to the PR
        uses: actions/github-script@v9
        with:
          script: |
            const results = {
              e2e: '${{ needs.e2e.result }}',
              // Index syntax: the GitHub expression parser reads the hyphen in
              // `needs.business-e2e` as a subtraction.
              businessE2e: '${{ needs['business-e2e'].result }}',
              loki: '${{ needs.loki.result }}',
            };
            const icon = (r) =>
              r === 'success'
                ? '✅ passed'
                : r === 'failure'
                  ? '❌ failed'
                  : `⚠️ ${r}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- ci-e2e-visual-results -->';
            const body = [
              marker,
              '### E2E & visual regression',
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| E2E (Playwright) | ${icon(results.e2e)} |`,
              `| Business E2E (Playwright) | ${icon(results.businessE2e)} |`,
              `| Visual regression (Loki) | ${icon(results.loki)} |`,
              '',
              `Artifacts on the [workflow run](${runUrl}): \`playwright-report-<shard>\` for each of the three consumer shards, \`business-playwright-report\`, plus \`loki-diffs-<configuration>\` for each Loki configuration that finds visual changes.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Builds

  # One job builds the three web apps and compiles the Firebase functions, and
  # only the ones the change affects (issue #1819). Four jobs of their own spent
  # 25 to 40 seconds each on checkout and cache restore, and a pull request that
  # fans out to that many runners queues behind itself.
  #
  # The functions compile is the only one in CI: the specs are transpiled per
  # file and the linter checks style, not assignability. Affected still selects
  # `functions` for everything that can break it - its own sources and package
  # files, a root dependency it imports, the workspace `typescript` and
  # `@types/node`, `tsconfig.base.json` and `nx.json`. It compiles with the
  # workspace TypeScript, because it does not install the functions package;
  # `deploy-functions` does install it and therefore compiles with the version
  # that package pins, so the two can disagree.
  # See ssot/implementation/firebase-functions.md.
  #
  # Nx runs every selected build even when one fails, so one app's compile
  # error still reports the others. The deploys below need this job, so on
  # `develop` a failed build holds back all four deploys, not only its own.
  build:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      - name: 'Setup env'
        uses: ./.github/actions/setup-env-for-affected

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      # `nx affected` has no filter that keeps only these four projects - a
      # `-p` is forwarded to the build and reaches `tsc` as its project path -
      # so the affected four are listed first and built with `run-many`. As in
      # `loki-build`, the list is read outside a condition so a failing Nx
      # fails the step rather than reading as "nothing affected".
      - name: Build the affected apps and functions
        shell: bash
        run: |
          affected=$(npm run --silent nx -- show projects --affected --projects bite-tribe,bite-tribe-business,bite-tribe-admin,functions --json)
          projects=$(jq -r 'join(",")' <<< "$affected")
          if [ -z "$projects" ]; then
            echo 'None of bite-tribe, bite-tribe-business, bite-tribe-admin and functions is affected. Builds skipped.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Building $projects" | tee -a "$GITHUB_STEP_SUMMARY"
          npm run nx -- run-many -t build -p "$projects"

  # BiteTribe

  deploy-bite-tribe:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup action
        uses: ./.github/actions/setup

      - name: Build BiteTribe App
        run: npm run nx -- build bite-tribe
        env:
          NX_APP_BITE_TRIBE_API_KEY: ${{ secrets.NX_APP_BITE_TRIBE_API_KEY }}
          NX_APP_BITE_TRIBE_AUTH_DOMAIN: ${{ secrets.NX_APP_BITE_TRIBE_AUTH_DOMAIN }}
          NX_APP_BITE_TRIBE_PROJECT_ID: ${{ secrets.NX_APP_BITE_TRIBE_PROJECT_ID }}
          NX_APP_BITE_TRIBE_STORAGE_BUCKET: ${{ secrets.NX_APP_BITE_TRIBE_STORAGE_BUCKET }}
          NX_APP_BITE_TRIBE_MESSAGING_SENDER_ID: ${{ secrets.NX_APP_BITE_TRIBE_MESSAGINX_SENDER_ID }}
          NX_APP_BITE_TRIBE_MEASSUREMENT_ID: ${{ secrets.NX_APP_BITE_TRIBE_MEASSUREMENT_ID }}
          NX_APP_BITE_TRIBE_APP_ID: ${{ secrets.NX_APP_BITE_TRIBE_APP_ID }}
          NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY: ${{ secrets.NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY }}
          # Enforced-mode App Check gate from issue 933: preflight the token and
          # show a retry gate instead of loading an app whose every request the
          # already-enforced backend will refuse. Release-candidate decision on
          # issue 1177. Consumer app only - the business app is out of
          # release-candidate scope, so its deploy leaves the gate off.
          NX_APP_BITE_TRIBE_APP_CHECK_ENFORCED: 'true'

      # The same gate the native release jobs run before wrapping a bundle
      # (issue 1181). Web deploys about a hundred times a month against four
      # native releases, so this is the artifact more people see, and it was
      # the one going out unverified.
      #
      # It is not redundant with the environment variable above. That variable
      # is an input; this checks the output actually carries it, and that
      # neither dev-only key survived into it. Nothing else fails when a
      # production bundle ships with the App Check gate off - it just quietly
      # stops gating.
      #
      # Consumer app only. deploy-bite-tribe-business deliberately leaves the
      # gate off, so the required-gate half of this check does not apply there.
      - name: Assert the deployed bundle carries no dev-only key
        run: npm run release:verify-bundle

      - name: BiteTribe Publish to Firebase
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE }}'
          channelId: live
          projectId: bite-tribe
          target: bite-tribe
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

  # BiteTribe Business

  deploy-bite-tribe-business:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup action
        uses: ./.github/actions/setup

      - name: Build BiteTribe Business App
        run: npm run nx -- build bite-tribe-business
        env:
          NX_APP_BITE_TRIBE_API_KEY: ${{ secrets.NX_APP_BITE_TRIBE_API_KEY }}
          NX_APP_BITE_TRIBE_BUSINESS_AUTH_DOMAIN: ${{ secrets.NX_APP_BITE_TRIBE_BUSINESS_AUTH_DOMAIN }}
          NX_APP_BITE_TRIBE_PROJECT_ID: ${{ secrets.NX_APP_BITE_TRIBE_PROJECT_ID }}
          NX_APP_BITE_TRIBE_STORAGE_BUCKET: ${{ secrets.NX_APP_BITE_TRIBE_STORAGE_BUCKET }}
          NX_APP_BITE_TRIBE_MESSAGING_SENDER_ID: ${{ secrets.NX_APP_BITE_TRIBE_MESSAGINX_SENDER_ID }}
          # Needed since the table operations of issue 1098, which are the first
          # events this app sends. Without it `measurementId` is absent from the
          # Firebase options and the web SDK has to recover it from a runtime
          # `webConfig` fetch keyed on the app id - a path nothing here asserts
          # and whose failure is silent, because `AnalyticsService` swallows a
          # send that throws. The consumer deploy and the native release have
          # always passed it; this app simply had no analytics to need it.
          NX_APP_BITE_TRIBE_MEASSUREMENT_ID: ${{ secrets.NX_APP_BITE_TRIBE_MEASSUREMENT_ID }}
          NX_APP_BITE_TRIBE_APP_ID: ${{ secrets.NX_APP_BITE_TRIBE_APP_ID }}
          NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY: ${{ secrets.NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY }}

      - name: BiteTribe Business Publish to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE }}'
          channelId: live
          projectId: bite-tribe
          target: bite-tribe-business
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

  # BiteTribe Admin

  # The internal operations tool (issue 1469). It mirrors the business deploy
  # above rather than sharing a job with it, because the two deploy to separate
  # hosting sites and a failed deploy of one must not hold the other back. Its
  # build runs in the shared `build` job.
  #
  # Like the business app it is out of release-candidate scope, so
  # `NX_APP_BITE_TRIBE_APP_CHECK_ENFORCED` is deliberately absent and
  # `release:verify-bundle` is not run here.

  deploy-bite-tribe-admin:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup action
        uses: ./.github/actions/setup

      - name: Build BiteTribe Admin App
        run: npm run nx -- build bite-tribe-admin
        env:
          NX_APP_BITE_TRIBE_API_KEY: ${{ secrets.NX_APP_BITE_TRIBE_API_KEY }}
          NX_APP_BITE_TRIBE_ADMIN_AUTH_DOMAIN: ${{ secrets.NX_APP_BITE_TRIBE_ADMIN_AUTH_DOMAIN }}
          NX_APP_BITE_TRIBE_PROJECT_ID: ${{ secrets.NX_APP_BITE_TRIBE_PROJECT_ID }}
          NX_APP_BITE_TRIBE_STORAGE_BUCKET: ${{ secrets.NX_APP_BITE_TRIBE_STORAGE_BUCKET }}
          NX_APP_BITE_TRIBE_MESSAGING_SENDER_ID: ${{ secrets.NX_APP_BITE_TRIBE_MESSAGINX_SENDER_ID }}
          NX_APP_BITE_TRIBE_APP_ID: ${{ secrets.NX_APP_BITE_TRIBE_APP_ID }}
          NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY: ${{ secrets.NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY }}

      - name: BiteTribe Admin Publish to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE }}'
          channelId: live
          projectId: bite-tribe
          target: bite-tribe-admin
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

  # Runs the Firebase Functions emulator suite, so the backend's transactional
  # behaviour fails on the pull request rather than on somebody's workstation.
  #
  # Until issue 1681 this ran nowhere. `jest.config.cjs` matches `*.spec.ts`
  # and the emulator specs are `*.emulator-spec.ts`, so the unit-test step
  # never saw them; `firestore-rules` below runs `--testPathPatterns
  # firestore-rules`, which is the rules specs alone. The other ~530
  # assertions - table sessions, orders, visits, assistance signals, QR abuse
  # protection - were verified only when a developer remembered to run them.
  # Three of them had been failing on `develop` since 16 September 2026 and
  # nothing said so.
  #
  # What these specs pin down is what a unit test cannot reach: what happens
  # inside a Firestore transaction when two callers contend on one document.
  # A mocked store would assert that the code called `set`, which was never
  # the part in doubt.
  #
  # **Deliberately a job of its own rather than widening `firestore-rules`.**
  # `deploy-firestore-rules` depends on that job, so folding the suite into it
  # would gate a production rules deploy - which takes effect the instant it
  # lands and cannot be staged - on a table-ordering spec. The two answer
  # different questions and should fail independently.
  #
  # It installs the functions package as well as the workspace root, and needs
  # a JVM for the emulator, exactly as `firestore-rules` does.
  functions-emulator:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      # The Firestore emulator requires a JVM; firebase-tools needs JDK 21+.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase Functions dependencies
        working-directory: apps/bite-tribe-firebase/functions
        run: npm ci

      - name: Run Firebase Functions emulator tests
        run: npm run nx -- firebase-test-emulator bite-tribe-firebase

  # Runs the Firestore security rules against the emulator, so a rule that
  # locks out a legitimate write or admits a forged one fails on the pull
  # request. Nothing else in CI evaluates `firestore.rules` directly: the e2e
  # suites exercise it, but only along the paths they happen to walk, and
  # neither of them can assert that something is *refused*. See issue 1078.
  #
  # It installs the functions package as well as the workspace root: the suite
  # needs `@firebase/rules-unit-testing` from the first and jest, ts-jest and
  # the Firebase client SDK from the second.
  firestore-rules:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      # The Firestore emulator requires a JVM; firebase-tools needs JDK 21+.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase Functions dependencies
        working-directory: apps/bite-tribe-firebase/functions
        run: npm ci

      - name: Run Firestore rules tests
        run: npm run nx -- firebase-test-rules bite-tribe-firebase

  # Publishes `firestore.rules` and `storage.rules` to the live project, so the
  # security contract in the repository is the one the project enforces. Before
  # this job the deploy ran from a workstation, which meant a merged rules
  # change could sit undeployed indefinitely while the repository looked
  # correct - issue 1078 is the worked example, and issue 1567 is the change
  # that ended it.
  #
  # It needs `firestore-rules`, so a ruleset that fails the emulator suite can
  # never be published. That ordering is the whole safety argument for
  # automating a deploy that takes effect the instant it lands and cannot be
  # staged or rolled back: recovery is a forward deploy of the reverted commit.
  #
  # `storage.rules` is deployed as committed, including its currently unscoped
  # state. Scoping it is issue 1350; shipping whatever is in the file is what
  # this job is for.
  deploy-firestore-rules:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - firestore-rules

    # Two rules deploys must not overlap. Each one creates a ruleset and then
    # moves the release pointer, so interleaving them can leave the release on
    # the older of two concurrent pushes.
    concurrency:
      group: deploy-firestore-rules-bite-tribe
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      # Written from an environment variable rather than passed as an argument,
      # so the value never reaches a process list, and to a file because
      # firebase-tools authenticates through GOOGLE_APPLICATION_CREDENTIALS.
      - name: Write the deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS is not set. Run tools/set-functions-deploy-service-account.sh.'
            exit 1
          fi

          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS" > "$RUNNER_TEMP/backend-deploy-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/backend-deploy-key.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore and Storage rules
        working-directory: apps/bite-tribe-firebase
        run: npx --no-install firebase deploy --only firestore:rules,storage --project bite-tribe --non-interactive

      - name: Record the deployed commit
        run: |
          {
            echo '### Security rules deployed'
            echo
            echo "Commit \`${GITHUB_SHA}\` to \`bite-tribe\`, covering \`firestore.rules\` and \`storage.rules\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/backend-deploy-key.json"

  # Deploys the Firestore index specification and then waits for the builds it
  # started to finish. Both halves are the job: `firebase deploy --only
  # firestore:indexes` starts a background build and returns immediately, so
  # deploying an index is not the same as having one, and a function that
  # queries through an index still in `CREATING` fails in production with
  # `FAILED_PRECONDITION`. That is issue 1227.
  #
  # `deploy-functions` needs this job rather than re-checking the state itself,
  # which is what enforces the ordering the manual process used to rely on
  # someone remembering.
  #
  # `--non-interactive` without `--force` is deliberate. An index that exists in
  # the project but is absent from the file is logged and skipped rather than
  # deleted, which keeps the subset semantics the wait also uses: an undeclared
  # index in production costs storage, a declared index missing from production
  # breaks a query. Deleting one stays a deliberate local command.
  deploy-firestore-indexes:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - tests

    # Two index deploys must not overlap: the second would read the build state
    # left by the first and could pass on an index the current commit does not
    # declare.
    concurrency:
      group: deploy-firestore-indexes-bite-tribe
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Install dependencies when the cache is unavailable'
        uses: ./.github/actions/install-if-missing

      - name: Write the deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS is not set. Run tools/set-functions-deploy-service-account.sh.'
            exit 1
          fi

          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS" > "$RUNNER_TEMP/backend-deploy-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/backend-deploy-key.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore indexes
        working-directory: apps/bite-tribe-firebase
        run: npx --no-install firebase deploy --only firestore:indexes --project bite-tribe --non-interactive

      # The wait, not a restatement of the deploy above. An index build is
      # proportional to the data already in the collection, so this can outlast
      # its timeout on a large one; that fails the job rather than holding the
      # deploy open, and re-running it after the build finishes passes with no
      # code change.
      - name: Wait for every declared index to reach READY
        run: npm run firestore:assert-indexes-ready

      - name: Remove the deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/backend-deploy-key.json"

  # Firebase Functions

  # Deploys the compiled functions to the live project, so backend behaviour
  # reaches production on the same push that shipped the web bundle calling it.
  # Before this job the deploy ran from a workstation, which meant a merged
  # function could sit undeployed indefinitely and the artifact came from
  # whatever state that machine was in. See issue 1464.
  #
  # It runs its own credential rather than reusing
  # `FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE`. A gen2 deploy needs Cloud Run,
  # Artifact Registry, Cloud Build, Eventarc, Cloud Scheduler and Secret Manager
  # admin; granting all of that to the hosting credential would widen the blast
  # radius of a secret three other jobs already use to publish static files.
  # Provision it with `bash tools/set-functions-deploy-service-account.sh`.
  #
  # `firebase deploy --only functions` never touches Firestore indexes, so a
  # function must not go live before the index its query needs is READY. That
  # is enforced by needing `deploy-firestore-indexes`, which deploys the
  # specification and then waits for the builds it started. See issue 1227.
  deploy-functions:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy-firestore-indexes

    # Two function deploys must not overlap. The workflow-level group already
    # supersedes an older run on the same ref; this one also covers a deploy
    # started from a different run, and `cancel-in-progress: false` queues it
    # rather than killing a deploy halfway through.
    concurrency:
      group: deploy-functions-bite-tribe
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup action
        uses: ./.github/actions/setup

      # The functions package carries its own package.json and package-lock.json
      # and is not part of the root install, while the `predeploy` hook in
      # apps/bite-tribe-firebase/firebase.json runs lint and `tsc` inside it.
      #
      # Installing here is also what picks the compiler. The workspace root has
      # TypeScript 6 and this package pins ^5.7.3, so a job that skips this step
      # compiles the deploy artifact with a different compiler than a workstation
      # deploy does. See [[Current State - Nx And Dependency Migration Roadmap]].
      - name: Install Firebase Functions dependencies
        working-directory: apps/bite-tribe-firebase/functions
        run: npm ci

      # Written from an environment variable rather than passed as an argument,
      # so the value never reaches a process list, and to a file because
      # firebase-tools authenticates through GOOGLE_APPLICATION_CREDENTIALS.
      - name: Write the deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS is not set. Run tools/set-functions-deploy-service-account.sh.'
            exit 1
          fi

          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE_FUNCTIONS" > "$RUNNER_TEMP/functions-deploy-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/functions-deploy-key.json" >> "$GITHUB_ENV"

      # No continue-on-error. A failed functions deploy after three successful
      # hosting deploys leaves a live frontend calling backend code that is not
      # there, and the only thing worse than that is not being told.
      #
      # `--non-interactive` matters beyond hanging: a function removed from the
      # source prompts for confirmation before deletion, and this fails instead.
      # Deleting a deployed function stays a deliberate local command.
      - name: Deploy Firebase Functions
        working-directory: apps/bite-tribe-firebase
        run: npx --no-install firebase deploy --only functions --project bite-tribe --non-interactive

      - name: Record the deployed commit
        run: |
          {
            echo '### Firebase Functions deployed'
            echo
            echo "Commit \`${GITHUB_SHA}\` to \`bite-tribe\`."
            echo
            echo 'Confirm the running revision with `npx firebase functions:log --project bite-tribe`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/functions-deploy-key.json"

  # BiteTribe Storybook

  # Gated on `loki` rather than `tests`, so the published Storybook is always one
  # whose stories passed visual regression on the same commit.
  #
  # The Storybook build reads no NX_APP_* variables, so unlike the two app
  # deploys this job needs no secrets — only the Firebase service account — and
  # may restore the build `loki` cached instead of rebuilding it.
  #
  # `loki` passes only when both capture legs did, so the deploy waits for
  # both configurations.
  #
  # It runs whether or not `loki` captured: a skipped capture means no story
  # changed since the last green run, so the stories are still the ones that
  # passed visual regression.
  deploy-bite-tribe-storybook:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - loki

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup action
        uses: ./.github/actions/setup

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Build BiteTribe Storybook
        run: npm run build:storybook

      # `npm run build:storybook` writes nxgraph.html before the build, but the
      # file is gitignored and so not part of build-storybook's hash: a cache hit
      # replays the graph of whichever run cached it. Copy this commit's graph
      # over it so the published Tech/Graph page is current.
      - name: Refresh the dependency graph in the built Storybook
        run: |
          rm -rf dist/storybook/storybook-host/assets/temp
          cp -R apps/storybook-host/src/assets/temp dist/storybook/storybook-host/assets/temp

      - name: BiteTribe Storybook Publish to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE }}'
          channelId: live
          projectId: bite-tribe
          target: bite-tribe-storybook
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
