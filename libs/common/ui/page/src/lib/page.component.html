<div class="ion-page">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        @if (chromeConfig().enableBackButton) {
          <ion-back-button defaultHref="/" />
        }
      </ion-buttons>

      <ion-title>
        <div
          class="title-container ion-display-flex ion-flex-row ion-align-items-center ion-justify-content-center"
        >
          <ion-icon src="assets/icons/logo-black-white.svg" color="primary" />
          <ion-text>
            <h2 class="headline">
              {{ appTitle() | uppercase }}
            </h2>
          </ion-text>
        </div>
      </ion-title>

      @if (chromeConfig().showHeaderMenu) {
        <ion-buttons slot="end">
          <ion-button data-testid="btn-menu" (click)="showMenuPopover($event)">
            <ion-icon slot="icon-only" name="menu-outline" />
          </ion-button>
        </ion-buttons>
      }
      <ng-content select="[header-end]"></ng-content>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div class="outer-content-container">
      <div
        class="inner-content-container {{
          chromeConfig().fullWidth ? 'full-width' : 'mobile-style'
        }}"
      >
        <ng-content></ng-content>
      </div>
    </div>
  </ion-content>

  <ng-container>
    @if (chromeConfig().showFooter) {
      <ion-footer>
        <ion-toolbar>
          @if (chromeConfig().showAddButton) {
            <ion-button
              class="button"
              expand="block"
              (click)="addButtonClick.emit($event)"
              data-testid="footer-add-button"
            >
              {{ addButtonText() ?? ('create-bite' | transloco) }}
            </ion-button>
          }
        </ion-toolbar>
      </ion-footer>
    }
  </ng-container>
</div>
