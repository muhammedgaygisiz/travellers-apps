<ta-page
  [showAddButton]="true"
  (showAddPopover)="showAddPopover($event)"
  (logoutClick)="onLogoutClick()"
>
  <ta-card>
    <ion-card-header>
      <ion-card-title color="primary">{{ totalAmount() }} $</ion-card-title>
      <ion-card-subtitle>Ihr Vermögen</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ta-chart [data]="chartData()" />
    </ion-card-content>
  </ta-card>

  @for (bank of banks(); track bank.id; let index = $index) {
  <finances-bank
    [bank]="bank"
    (openAccountDetails)="openAccountDetails.emit($event)"
  />
  }
</ta-page>
