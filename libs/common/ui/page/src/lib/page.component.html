<div class="ion-page">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        @if (enableBackButton()) {
          <ion-back-button defaultHref="/" />
        }
      </ion-buttons>

      <ion-title>
        <div class="title-container">
          <ion-icon src="assets/icons/logo-black-white.svg" color="secondary" />
          <ion-text color="secondary">
            <h2 class="headline">
              {{ appTitle() | uppercase }}
            </h2>
          </ion-text>
        </div>
      </ion-title>

      @if (showHeaderMenu()) {
        <ion-buttons slot="end">
          <ion-button data-cy="btn-menu" (click)="showMenuPopover($event)">
            <ion-icon slot="icon-only" name="menu-outline" color="secondary" />
          </ion-button>
        </ion-buttons>
      }
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div class="outer-content-container">
      <div
        class="inner-content-container {{
          fullWidth() ? 'full-width' : 'mobile-style'
        }}"
      >
        <ng-content></ng-content>
      </div>
    </div>
  </ion-content>

  <ng-container>
    @if (showFooter()) {
      <ion-footer>
        <ion-toolbar>
          @if (showAddButton()) {
            <ion-button
              class="button"
              expand="block"
              (click)="addButtonClick.emit($event)"
            >
              {{ addButtonText() }}
            </ion-button>
          }
        </ion-toolbar>
      </ion-footer>
    }
  </ng-container>
</div>
