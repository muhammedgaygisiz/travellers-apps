<ta-page
  [showHeaderMenu]="false"
  [showAddButton]="false"
  [enableBackButton]="true"
  [showFooter]="false"
>
  <ion-content>
    <ion-img
      [src]="restaurant()?.imagePath || restaurant()?.image"
      class="place-image"
    />

    <h1>{{ placeName() }}</h1>

    <business-menu [menu]="menu()" (saveMenu)="saveMenu.emit($event)" />
  </ion-content>
</ta-page>
