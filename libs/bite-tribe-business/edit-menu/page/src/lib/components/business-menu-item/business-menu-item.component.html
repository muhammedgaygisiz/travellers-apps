@let itemData = item();
@let isVariantData = isVariant();

<div class="menu-item">
  <div class="item-container">
    <h3>
      <ion-input
        [formField]="itemForm.name"
        expand="block"
        fill="outline"
        mode="md"
        class="ion-margin-top"
      />
    </h3>
    <business-menu-variant
      [currencySymbol]="currencySymbol()"
      [item]="itemData"
      (addItem)="onAddVariant($event)"
      (itemChanged)="onEditVariant($event)"
      isVariant
    />
    @if (itemData?.variants?.length) {
      <div class="ion-margin-top">
        @for (variant of itemData?.variants; track $index) {
          <business-menu-variant
            [currencySymbol]="currencySymbol()"
            class="variant-margin"
            [item]="variant"
            (itemChanged)="onEditVariant($event, $index)"
            isVariant
          />
        }
      </div>
    }
  </div>
  @if (showNewVariantComponent()) {
    <business-menu-variant
      [currencySymbol]="currencySymbol()"
      isVariant
      class="variant-margin"
      (addItem)="onAddVariant($event)"
      (cancelAddItem)="onCancelAddItem()"
    />
  }
  @if (!isVariantData && !showNewVariantComponent()) {
    <ion-button
      expand="block"
      class="ion-margin-top"
      (click)="onAddVariantClick()"
    >
      Add Variant
    </ion-button>
  }
</div>
