    <meta charset="utf-8" />
    <title>BiteTribe – Find it. Try it. Share it.</title>
    <base href="/" />

    <!--
      Search and social metadata (issue #1454). Static, because the crawlers and
      unfurlers that read it either do not run the app's JavaScript at all, or
      read this document before Angular has bootstrapped. The one exception is
      the canonical link, which `provideCanonicalUrl` rewrites per route for the
      public pages; see libs/bite-tribe/shell/src/lib/canonical-url.ts.

      The description is the approved App Store promotional text, and the title
      carries the approved subtitle, so the web and the two stores say the same
      thing. Both live in `Implementation - Store Listing Assets`; change them
      there first.
    -->
    <meta
      name="description"
      content="Every pin on the map is one real dish, photographed by the person who ate it, with the price they paid and what they honestly thought."
    />
    <!--
      bitetribe.app is canonical, decided 1 September 2026. www.bitetribe.app
      and bite-tribe.web.app serve the same build, so without this the ranking
      signal splits across three hosts.
    -->
    <link rel="canonical" href="https://bitetribe.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BiteTribe" />
    <meta property="og:url" content="https://bitetribe.app/" />
    <meta
      property="og:title"
      content="BiteTribe – Find it. Try it. Share it."
    />
    <meta
      property="og:description"
      content="Every pin on the map is one real dish, photographed by the person who ate it, with the price they paid and what they honestly thought."
    />
    <!-- Absolute by requirement: unfurlers do not resolve relative image URLs. -->
    <meta
      property="og:image"
      content="https://bitetribe.app/assets/social/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The BiteTribe mascot and wordmark beside a close-up of a spiced meat and vegetable dish."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <!--
      twitter:site attributes the card to our own X account and is what renders
      the "@bitetribeapp" byline on a shared link. The handle was decided under
      issue #1455; see `Implementation - Social Media Channels`.

      The account was registered on 2 September 2026, so this tag resolves and
      the ordering risk it used to carry - shipping a handle nobody owned, for
      someone else to claim - is closed.
    -->
    <meta name="twitter:site" content="@bitetribeapp" />
    <meta
      name="twitter:title"
      content="BiteTribe – Find it. Try it. Share it."
    />
    <meta
      name="twitter:description"
      content="Every pin on the map is one real dish, photographed by the person who ate it, with the price they paid and what they honestly thought."
    />
    <meta
      name="twitter:image"
      content="https://bitetribe.app/assets/social/og-image.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="The BiteTribe mascot and wordmark beside a close-up of a spiced meat and vegetable dish."
    />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
