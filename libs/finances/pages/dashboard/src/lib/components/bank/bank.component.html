@if (bank(); as bank) {
<ion-item-group class="ion-margin-top">
  <ion-item-divider>
    <ion-label> {{ bank.name }} </ion-label>
  </ion-item-divider>

  @for (account of bank.accounts; track account.number) {
  <ion-item [button]="true">
    <ion-label>{{ account.type }} ({{ account.number }})</ion-label>
    <ion-note slot="end">{{ account.balance }} $</ion-note>
  </ion-item>
  }
</ion-item-group>
}
