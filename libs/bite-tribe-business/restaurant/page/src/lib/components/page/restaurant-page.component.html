<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <input
    type="file"
    #fileUploader
    class="ion-hide"
    (change)="onFileSelected($event)"
  />

  <ion-content class="ion-padding">
    <h1>Create Restaurant</h1>

    <img [src]="imageBase64()" alt="Restaurant Image" />

    <form [formGroup]="restaurantFormGroup">
      @if (!showImage()) {
      <ion-card class="image-placeholder" (click)="onImageUploadClick()">
        <ion-card-content>
          <ion-icon name="image-outline" size="large" />
        </ion-card-content>
      </ion-card>
      }

      <ion-list lines="full" class="ion-padding-top ion-padding-bottom">
        <ion-item>
          <ion-input label="Restaurant Name" formControlName="name" />
        </ion-item>

        <ion-item lines="full">
          <ion-input
            type="number"
            formControlName="latitude"
            inputmode="decimal"
            label="Latitude"
          />
        </ion-item>

        <ion-item lines="full">
          <ion-input
            type="number"
            formControlName="longitude"
            inputmode="decimal"
            label="Longitude"
          />
        </ion-item>
      </ion-list>

      @let bites = restaurant()?.bites || []; @for (bite of bites; track
      bite.id) {
      <bt-bite [bite]="bite" (biteClick)="biteClick.emit($event)" />
      }

      <ion-button
        expand="block"
        color="primary"
        routerDirection="back"
        class="ion-margin-top"
        [disabled]="isInvalid()"
        (click)="saveNewRestaurant()"
      >
        Save
      </ion-button>
    </form>
  </ion-content>
</ta-page>
