<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>Create Restaurant</h1>

    <form [formGroup]="restaurantFormGroup">
      <image-upload formControlName="image" />

      <ion-input
        label="Restaurant Name"
        formControlName="name"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <ion-textarea
        class="ion-margin-top"
        label="{{ 'about-restaurant' | transloco }}"
        formControlName="description"
        fill="outline"
        auto-grow="true"
        [maxlength]="500"
        [rows]="6"
        mode="md"
      />

      <ion-input
        label="{{ 'street' | transloco }}"
        formControlName="street"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <div class="ion-display-flex ion-gap-2 ion-margin-top">
        <ion-input
          label="{{ 'postcode' | transloco }}"
          formControlName="postcode"
          fill="outline"
          mode="md"
          class="ion-flex-1 ion-margin-end"
        />
        <ion-input
          label="{{ 'city' | transloco }}"
          formControlName="city"
          fill="outline"
          mode="md"
          class="ion-flex-1"
        />
      </div>

      <ion-input
        label="{{ 'country' | transloco }}"
        formControlName="country"
        fill="outline"
        class="ion-margin-top"
        mode="md"
      />

      <div class="ion-padding-top">
        <position formControlName="position" />
      </div>

      @let bites = restaurant()?.bites || [];
      @for (bite of bites; track bite.id) {
        <bt-bite [bite]="bite" (biteClick)="biteClick.emit($event)" />
      }

      <ion-button
        expand="block"
        color="primary"
        routerDirection="back"
        class="ion-margin-top"
        [disabled]="isInvalid()"
        (click)="saveNewRestaurant()"
      >
        Save
      </ion-button>
    </form>
  </ion-content>
</ta-page>
