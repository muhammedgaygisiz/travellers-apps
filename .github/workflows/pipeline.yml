name: BiteTribe CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      nx_verbose_logging:
        description: 'NX Verbose Logging'
        required: false
        default: 'false'
        type: boolean

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NX_DAEMON: false
  NX_VERBOSE_LOGGING: ${{ github.event.inputs.nx_verbose_logging }}
  NX_BASE: develop

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Setup action
        uses: ./.github/actions/setup

  lint:
    runs-on: ubuntu-latest
    needs:
      - setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Setup env'
        uses: ./.github/actions/setup-env-for-affected

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Run Linter
        run: npm run nx -- affected -t lint

  stylelint:
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Setup env'
        uses: ./.github/actions/setup-env-for-affected

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Run Stylelint
        run: npm run nx -- affected -t stylelint

  tests:
    runs-on: ubuntu-latest
    needs:
      - stylelint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Setup env'
        uses: ./.github/actions/setup-env-for-affected

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Run Unit Tests
        run: npm run nx -- affected -t test --coverage --coverageReporters=cobertura

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          directory: ./coverage # optional
          flags: unittests # optional
          name: codecov-umbrella # optional
          fail_ci_if_error: false # optional (default = false)
          verbose: false # optional (default = false)

  loki:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      # Build the static Storybook (dist/storybook/storybook-host) the same way
      # as the manual Loki reference-update workflow, so captures match the
      # committed references.
      - name: Build Storybook
        run: npm run build:storybook

      # Run the full visual-regression suite through the upstream oblador/loki
      # CLI (tools/loki.mjs) against the committed .loki/reference images. Loki
      # drives a headless Chrome inside Docker, which is available on
      # ubuntu-latest. A visual diff fails the job (blocking check).
      - name: Run Loki visual tests
        run: npm run loki:test

      - name: Upload Loki diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: loki-diffs
          path: .loki/difference
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      # The Firebase emulators require a JVM; firebase-tools needs JDK 21+.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Boots the Firebase emulators + Angular dev server (see
      # apps/bite-tribe-e2e/playwright.config.ts) and runs the suite.
      #
      # apps/bite-tribe/.env is gitignored, so these NX_* vars are absent in CI.
      # env-var-plugin.js inlines them into the served bundle at build time.
      # NX_APP_BITE_TRIBE_IS_DEV=true routes the app to the Firebase emulators
      # (and skips App Check); without it the app targets production Firebase and
      # hangs headless. All traffic stays on the local emulators, so the values
      # below only need a matching projectId — the rest are throwaway demo values.
      - name: Run E2E Tests
        run: npm run nx -- e2e bite-tribe-e2e
        env:
          NX_APP_BITE_TRIBE_IS_DEV: 'true'
          NX_APP_BITE_TRIBE_PROJECT_ID: bite-tribe
          NX_APP_BITE_TRIBE_API_KEY: demo-api-key
          NX_APP_BITE_TRIBE_AUTH_DOMAIN: bite-tribe.firebaseapp.com
          NX_APP_BITE_TRIBE_STORAGE_BUCKET: bite-tribe.appspot.com
          NX_APP_BITE_TRIBE_MESSAGING_SENDER_ID: '000000000000'
          NX_APP_BITE_TRIBE_APP_ID: demo-app-id

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: dist/.playwright/apps/bite-tribe-e2e
          retention-days: 7

  # Surfaces the e2e and Loki outcomes on the PR as a single sticky comment.
  # Runs after both regardless of their result so a failure is still reported.
  report:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs:
      - e2e
      - loki

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Post e2e and Loki results to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              e2e: '${{ needs.e2e.result }}',
              loki: '${{ needs.loki.result }}',
            };
            const icon = (r) =>
              r === 'success'
                ? '✅ passed'
                : r === 'failure'
                  ? '❌ failed'
                  : `⚠️ ${r}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- ci-e2e-visual-results -->';
            const body = [
              marker,
              '### E2E & visual regression',
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| E2E (Playwright) | ${icon(results.e2e)} |`,
              `| Visual regression (Loki) | ${icon(results.loki)} |`,
              '',
              `Artifacts on the [workflow run](${runUrl}): \`playwright-report\`, plus \`loki-diffs\` when Loki finds visual changes.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Bite Tribe

  bite-tribe-build:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Build Bite Tribe App
        run: npm run nx -- build bite-tribe

  deploy-bite-tribe:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - bite-tribe-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup action
        uses: ./.github/actions/setup

      - name: Build Bite Tribe App
        run: npm run nx -- build bite-tribe
        env:
          NX_APP_BITE_TRIBE_API_KEY: ${{ secrets.NX_APP_BITE_TRIBE_API_KEY }}
          NX_APP_BITE_TRIBE_AUTH_DOMAIN: ${{ secrets.NX_APP_BITE_TRIBE_AUTH_DOMAIN }}
          NX_APP_BITE_TRIBE_PROJECT_ID: ${{ secrets.NX_APP_BITE_TRIBE_PROJECT_ID }}
          NX_APP_BITE_TRIBE_STORAGE_BUCKET: ${{ secrets.NX_APP_BITE_TRIBE_STORAGE_BUCKET }}
          NX_APP_BITE_TRIBE_MESSAGING_SENDER_ID: ${{ secrets.NX_APP_BITE_TRIBE_MESSAGINX_SENDER_ID }}
          NX_APP_BITE_TRIBE_MEASSUREMENT_ID: ${{ secrets.NX_APP_BITE_TRIBE_MEASSUREMENT_ID }}
          NX_APP_BITE_TRIBE_APP_ID: ${{ secrets.NX_APP_BITE_TRIBE_APP_ID }}
          NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY: ${{ secrets.NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY }}

      - name: Bite Tribe Publish to Firebase
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE }}'
          channelId: live
          projectId: bite-tribe
          target: bite-tribe
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

  # Bite Tribe Business

  bite-tribe-business-build:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: 'Restore Cache'
        uses: ./.github/actions/restore-cache

      - name: 'Nx cache'
        uses: ./.github/actions/nx-cache

      - name: Build Bite Tribe Business App
        run: npm run nx -- build bite-tribe-business

  deploy-bite-tribe-business:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs:
      - bite-tribe-business-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup action
        uses: ./.github/actions/setup

      - name: Build Bite Tribe Business App
        run: npm run nx -- build bite-tribe-business
        env:
          NX_APP_BITE_TRIBE_API_KEY: ${{ secrets.NX_APP_BITE_TRIBE_API_KEY }}
          NX_APP_BITE_TRIBE_BUSINESS_AUTH_DOMAIN: ${{ secrets.NX_APP_BITE_TRIBE_BUSINESS_AUTH_DOMAIN }}
          NX_APP_BITE_TRIBE_PROJECT_ID: ${{ secrets.NX_APP_BITE_TRIBE_PROJECT_ID }}
          NX_APP_BITE_TRIBE_STORAGE_BUCKET: ${{ secrets.NX_APP_BITE_TRIBE_STORAGE_BUCKET }}
          NX_APP_BITE_TRIBE_MESSAGING_SENDER_ID: ${{ secrets.NX_APP_BITE_TRIBE_MESSAGINX_SENDER_ID }}
          NX_APP_BITE_TRIBE_APP_ID: ${{ secrets.NX_APP_BITE_TRIBE_APP_ID }}
          NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY: ${{ secrets.NX_APP_BITE_TRIBE_APP_CHECK_SITE_KEY }}

      - name: Bite Tribe Business Publish to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE }}'
          channelId: live
          projectId: bite-tribe
          target: bite-tribe-business
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
