name: Travellers Apps CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      nx_verbose_logging:
        description: 'NX Verbose Logging'
        required: false
        default: 'false'
        type: boolean
      skip_remote_cache:
        description: "Skip Nx remote cache?"
        required: false
        default: 'true'
        type: boolean

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NX_DAEMON: false
  NX_VERBOSE_LOGGING: ${{ github.event.inputs.nx_verbose_logging }}
  NX_BASE: develop

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Setup action
        uses: ./.github/actions/setup

  lint:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: "Setup env"
        uses: ./.github/actions/setup-env-for-affected

      - name: Run Linter
        run: npm run nx -- affected -t lint ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

  stylelint:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: "Setup env"
        uses: ./.github/actions/setup-env-for-affected

      - name: Run Stylelint
        run: npm run nx -- affected -t stylelint ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

  tests:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - stylelint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: "Setup env"
        uses: ./.github/actions/setup-env-for-affected

      - name: Run Unit Tests
        run: npm run nx -- affected -t test --coverage --coverageReporters=cobertura  ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          directory: ./coverage # optional
          flags: unittests # optional
          name: codecov-umbrella # optional
          fail_ci_if_error: false # optional (default = false)
          verbose: false # optional (default = false)

  build-storybooks:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: "Setup env"
        uses: ./.github/actions/setup-env-for-affected

      - run: npm run nx -- affected -t build-storybook --configuration=ci  ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

      - name: Cache Storybook Builds
        uses: actions/cache@v4
        with:
          path: dist/storybook
          key: storybooks-${{ hashFiles('**/**/*.stories.*') }}

  loki:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    continue-on-error: true
    needs:
      - build-storybooks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: "Setup env"
        uses: ./.github/actions/setup-env-for-affected

      - uses: actions/cache/restore@v4
        with:
          path: dist/storybook/prices
          key: storybooks-${{ hashFiles('**/**/*.stories.*') }}

      - run: npm run nx -- affected -t test-loki  ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

      - name: Upload Prices Diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: loki-diffs
          path: apps/**/.loki/difference

  #Prices

  prices-e2e-test:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - loki

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Run E2E Tests
        uses: cypress-io/github-action@v4.2.0
        with:
          install: true
          command: |
            npm run nx -- e2e prices-e2e --configurations=production  ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}
        env:
          # pass GitHub token to detect new build vs re-run build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYPRESS_password: ${{ secrets.CYPRESS_PASSWORD }}
          CYPRESS_username: ${{ secrets.CYPRESS_USER_NAME }}
          NX_APP_API_KEY: ${{ secrets.NX_APP_API_KEY }}

  prices-build:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - prices-e2e-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: Build Prices App
        run: npm run nx -- build prices ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}
        env:
          NX_APP_API_KEY: ${{ secrets.NX_APP_API_KEY }}
          NX_APP_AUTH_DOMAIN: ${{ secrets.NX_APP_AUTH_DOMAIN }}
          NX_APP_PROJECT_ID: ${{ secrets.NX_APP_PROJECT_ID }}
          NX_APP_STORAGE_BUCKET: ${{ secrets.NX_APP_STORAGE_BUCKET }}
          NX_APP_MESSAGING_SENDER_ID: ${{ secrets.NX_APP_MESSAGING_SENDER_ID }}
          NX_APP_GEOAPIFY_API_KEY: ${{ secrets.NX_APP_GEOAPIFY_API_KEY }}

      - name: Cache Prices Build
        uses: actions/cache@v4
        with:
          path: dist/apps/prices
          key: prices-build-${{ hashFiles('package-lock.json') }}

  prices-cap-sync:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - prices-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - uses: actions/cache/restore@v4
        with:
          path: dist/apps/prices
          key: prices-build-${{ hashFiles('package-lock.json') }}

      - name: Capacitor Sync
        run: npm run cap:sync ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

# KOSAML

  kosaml-build:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - loki

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: Build Prices App
        run: npm run nx -- build kosaml ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

# Finances

  finances-build:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: Build Prices App
        run: npm run nx -- build finances ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

# Finances

  bite-tribe-build:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: Build Bite Tribe App
        run: npm run nx -- build bite-tribe ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

# CV

  cv-build:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_REMOTE_CACHE: ${{ github.event.inputs.skip_remote_cache }}
    needs:
      - setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: "Restore Cache"
        uses: ./.github/actions/restore-cache

      - name: Build CV App
        run: npm run nx -- build cv ${{ github.event.inputs.skip_remote_cache == 'true' && '--no-cloud' || '' }}

      - name: Cache CV Build
        uses: actions/cache@v4
        with:
          path: dist/apps/cv/browser
          key: cv-build-${{ hashFiles('package-lock.json') }}
