<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  @if (isWeb()) {
  <input
    type="file"
    #fileUploader
    class="ion-hide"
    (change)="onFileSelected($event)"
  />
  }

  <ion-content class="ion-padding">
    <h1>Create Bite</h1>

    <img [src]="imageBase64()" />
    @if(showImage()) {
    <div class="ion-text-end">
      <ion-button fill="clear" (click)="clearImage()">Delete</ion-button>
    </div>
    }

    <form [formGroup]="biteFormGroup">
      @if(!showImage()) {
      <ion-card class="image-placeholder" (click)="onImageUploadClick()">
        <ion-card-content>
          @if (isWeb()) {
          <ion-icon name="image-outline" size="large" />
          } @else {
          <ion-icon name="camera-outline" size="large" />
          }
        </ion-card-content>
      </ion-card>
      }

      <ion-list lines="full" class="ion-padding-top">
        <ion-item>
          <ion-input label="Dish Name" formControlName="name" />
        </ion-item>
        <ion-item>
          <ion-input label="Place Name" formControlName="place" />
        </ion-item>
        <ion-item>
          <ion-input label="Price" formControlName="price" />
          <ion-select formControlName="currency" interface="popover">
            <ion-select-option value="EUR">EUR</ion-select-option>
            <ion-select-option value="USD">USD</ion-select-option>
            <ion-select-option value="THB">THB</ion-select-option>
            <ion-select-option value="CHF">CHF</ion-select-option>
          </ion-select>
        </ion-item>
        <ion-item>
          <ion-input label="Tags" formControlName="tags" />
        </ion-item>
        <ion-item>
          <ion-input label="Latitude" readonly formControlName="latitude" />
        </ion-item>
        <ion-item>
          <ion-input label="Longitude" readonly formControlName="longitude" />
        </ion-item>
      </ion-list>

      <ion-button
        expand="block"
        color="primary"
        routerDirection="back"
        class="ion-margin-top"
        [disabled]="isInvalid()"
        (click)="saveNewBite()"
      >
        Post
      </ion-button>
    </form>
  </ion-content>
</ta-page>
