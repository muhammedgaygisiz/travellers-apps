<ta-page
  [chrome]="{
    enableBackButton: true,
    showHeaderMenu: false,
    showFooter: false,
  }"
  [menuConfig]="{ hideAuth: true }"
>
  <ion-content class="ion-padding">
    <h1 class="ion-margin-bottom">{{ 'forgot-password' | transloco }}</h1>

    <form [formGroup]="forgotPasswordFormGroup">
      <ion-input
        label="{{ 'email' | transloco }}"
        formControlName="email"
        fill="outline"
        mode="md"
        class="ion-margin-top"
        autocomplete="email"
        inputmode="email"
        data-testid="email"
      />

      <ion-button
        class="ion-margin-top"
        expand="block"
        [disabled]="!forgotPasswordFormGroup.valid"
        (click)="submit()"
        data-testid="submit"
        >{{ 'send-password-reset-link' | transloco }}</ion-button
      >

      @if (resetRequested()) {
        <div class="ion-margin-top">
          <ion-text color="success">{{
            'password-reset-requested-check-your-email' | transloco
          }}</ion-text>
        </div>
      }

      @if (resetFailed()) {
        <div class="ion-margin-top">
          <ion-text color="danger">{{
            'password-reset-request-failed-try-again' | transloco
          }}</ion-text>
        </div>
      }

      <ion-button
        class="ion-margin-top"
        expand="block"
        fill="outline"
        type="button"
        (click)="backToLogin.emit()"
        data-testid="back-to-login"
        >{{ 'back-to-log-in' | transloco }}</ion-button
      >
    </form>
  </ion-content>
</ta-page>
