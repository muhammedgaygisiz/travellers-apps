name: Deploy Bite Tribe

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  deploy-bite-tribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup action
        uses: ./.github/actions/setup

      - name: Build Bite Tribe App
        run: npm run nx -- build bite-tribe
        env:
          NX_APP_FINANCES_API_KEY: ${{ secrets.NX_APP_BITE_TRIBE_API_KEY }}
          NX_APP_FINANCES_AUTH_DOMAIN: ${{ secrets.NX_APP_BITE_TRIBE_AUTH_DOMAIN }}
          NX_APP_FINANCES_PROJECT_ID: ${{ secrets.NX_APP_BITE_TRIBE_PROJECT_ID }}
          NX_APP_FINANCES_STORAGE_BUCKET: ${{ secrets.NX_APP_BITE_TRIBE_STORAGE_BUCKET }}
          NX_APP_FINANCES_MESSAGING_SENDER_ID: ${{ secrets.NX_APP_BITE_TRIBE_MESSAGINX_SENDER_ID }}

      - name: Bite Tribe Preview of Pull Request
        if: github.event.pull_request.base.ref == 'develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE }}'
          projectId: bite-tribe
          target: bite-tribe
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

      - name: Bite Tribe Publish to Firebase
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BITE_TRIBE }}'
          channelId: live
          projectId: bite-tribe
          target: bite-tribe
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
