<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
  [fullWidth]="true"
>
  <ion-content class="ion-padding">
    <div class="ion-display-flex ion-flex-row">
      <div
        class="ion-display-flex ion-flex-column ion-flex-2 ion-padding column"
      >
        <ion-card>
          <ion-card-header>
            <ion-card-title>Employees</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="full">
              @for ( employee of employees(); track employee.userId ) {
              <ion-item [button]="true" (click)="selectEmployee(employee)">
                <ion-label>{{ employee.displayName }}</ion-label>
              </ion-item>
              } @empty {
              <p>No employees found.</p>
              }
            </ion-list>
          </ion-card-content>
        </ion-card>
      </div>
      <div
        class="ion-display-flex ion-flex-column ion-flex-2 ion-padding column"
      >
        <ion-card>
          <ion-card-header>
            <ion-card-title>Bites</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="full">
              @for (bite of bites(); track bite.id) {
              <ion-item>
                <ion-checkbox slot="start" aria-label="Toggle Bite selection" />
                <ion-label>{{ bite.name }}</ion-label>
              </ion-item>
              } @empty {
              <p>No bites found.</p>
              }
            </ion-list>
          </ion-card-content>
        </ion-card>
      </div>
      <div
        class="ion-display-flex ion-flex-column ion-flex-1 ion-padding column"
      ></div>
    </div>
  </ion-content>
</ta-page>
