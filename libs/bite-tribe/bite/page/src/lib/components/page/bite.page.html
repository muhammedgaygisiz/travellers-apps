<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>Create Bite</h1>

    <form [formGroup]="biteFormGroup">
      <image-upload
        formControlName="image"
        [position]="this.position()"
        (positionFromImage)="onPositionFromImage($event)"
      />

      <ion-list lines="full" class="ion-padding-top">
        <ion-item>
          <ion-input label="Dish Name" formControlName="name" />
        </ion-item>
        <ion-item>
          <ion-input label="Place Name" formControlName="place" />
        </ion-item>
        <ion-item>
          <ion-input label="Price" formControlName="price" />
          <ion-select formControlName="currency" interface="popover">
            <ion-select-option value="EUR">EUR</ion-select-option>
            <ion-select-option value="USD">USD</ion-select-option>
            <ion-select-option value="THB">THB</ion-select-option>
            <ion-select-option value="CHF">CHF</ion-select-option>
          </ion-select>
        </ion-item>
        <ion-item>
          <ion-input label="Tags" formControlName="tags" />
        </ion-item>
      </ion-list>

      <div class="ion-padding-top">
        <bt-map [position]="positionToUse()" />
        @if (noGpsPosition()) {
        <ion-text color="danger">
          <p>{{ getGpsErrorMessage() }}</p>
        </ion-text>
        }
      </div>

      <ion-button
        expand="block"
        color="primary"
        routerDirection="back"
        class="ion-margin-top"
        [disabled]="isInvalid()"
        (click)="saveNewBite()"
      >
        Post
      </ion-button>
    </form>
  </ion-content>
</ta-page>
