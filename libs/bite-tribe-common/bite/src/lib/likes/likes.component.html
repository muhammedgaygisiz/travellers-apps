<div class="like-container {{ inCard() ? 'in-card' : '' }}">
  @if (showChip()) {
    <ion-chip
      data-testid="like-chip"
      class="{{ calcClass() }}"
      (click)="openLikeOptions($event)"
    >
      @if (totalLikeCount()) {
        @for (
          entry of likeEmojiEntries();
          let last = $last;
          track entry.likeType
        ) {
          <ion-label
            class="emoji"
            [class.last-emoji]="last"
            [class.popped]="entry.likeType === poppedLikeType()"
            (animationend)="onPopEnd()"
            >{{ entry.emoji }}</ion-label
          >
        }
        <ion-label class="like-nr" data-testid="like-count">{{
          totalLikeCount()
        }}</ion-label>
      } @else {
        <ion-label class="ion-margin-horizontal">👍</ion-label>
      }
    </ion-chip>
  }
</div>
