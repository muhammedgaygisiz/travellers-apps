<ta-page
  [showHeaderMenu]="true"
  [showLanguages]="false"
  [showAddButton]="true"
  [showSettingsButton]="true"
  (logoutClick)="logoutClick.emit()"
  (addButtonClick)="addButtonClick.emit()"
  (gotoSettings)="gotoSettings.emit()"
>
  <ion-content class="ion-padding">
    <div class="desktop-layout">
      <div class="filters-column">
        <h1>Bites</h1>

        <div class="chip-container">
          <ion-chip>Map View</ion-chip>
          <ion-chip>Nearby</ion-chip>
          <ion-chip>Vegan</ion-chip>
        </div>
      </div>

      <div class="bites-grid">
        @if (!bites()?.length) {
        <ion-card>
          <ion-card-content>
            <ion-text color="primary">
              No bites found. Be the first one.</ion-text
            >
          </ion-card-content>
        </ion-card>
        } @for (bite of bites(); track bite.id) {
        <bt-bite
          [bite]="bite"
          [userId]="userId()"
          (biteClick)="biteClick.emit($event)"
          (restaurantClick)="restaurantClick.emit($event)"
          (likeButtonClick)="likeButtonClick.emit($event)"
        />
        }
      </div>
    </div>
  </ion-content>
</ta-page>
