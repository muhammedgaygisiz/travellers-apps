<div class="menu-container">
  @if (visibleCategories().length) {
    <ion-reorder-group [disabled]="true">
      @for (category of visibleCategories(); track category.id) {
        <div class="menu-item">
          <category
            [category]="category"
            [currency]="currency()"
            [canCreateBite]="canCreateBite()"
            [canAddToCart]="canAddToCart()"
            [stats]="stats()"
            [dietaryVotes]="dietaryVotes()"
            (dietaryVoteClick)="dietaryVoteClick.emit($event)"
            (biteSignalClick)="biteSignalClick.emit($event)"
            (createBiteClick)="createBiteClick.emit($event)"
            (addToCartClick)="addToCartClick.emit($event)"
          />
        </div>
      }
    </ion-reorder-group>
  } @else {
    <div class="menu-placeholder">
      <p>{{ 'no-menu-yet' | transloco }}</p>
    </div>
  }
</div>
