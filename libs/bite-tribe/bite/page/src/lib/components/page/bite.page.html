<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>{{ title() }}</h1>

    <form [formGroup]="biteFormGroup">
      <image-upload
        formControlName="image"
        [position]="this.fallbackPosition()"
        (positionFromImage)="onPositionFromImage($event)"
        (startCropImage)="emitStartCropImage($event)"
      />

      <ion-input
        label="Dish Name"
        formControlName="name"
        fill="solid"
        class="ion-margin-top"
      />
      <hr />

      <div class="ion-margin-vertical">
        <star-rating formControlName="rating" />
      </div>

      <ion-input label="Place Name" formControlName="place" />
      <hr />

      <div>
        <div class="price">
          <ion-input
            label="Price"
            formControlName="price"
            inputmode="decimal"
          />

          <ion-select formControlName="currency" interface="modal">
            @for(currency of currencies; track currency.code) {
            <ion-select-option [value]="currency.code"
              >{{ currency.name }}</ion-select-option
            >
            }
          </ion-select>
        </div>
        <hr class="sams-favorite-hr" />
        <ion-note>Enter the price in the valid format (e.g. 12.34).</ion-note>
      </div>

      <bt-tags-input
        [tags]="biteFormGroup.get('tags')?.value || []"
        (tagChanges)="biteFormGroup.get('tags')?.setValue($event)"
      />
      <hr class="sams-favorite-hr" />

      <div class="ion-padding-top">
        <position formControlName="position" />
        @if (noGpsPosition()) {
        <ion-text color="danger">
          <p>{{ getGpsErrorMessage() }}</p>
        </ion-text>
        }
      </div>

      <ion-button
        expand="block"
        color="primary"
        routerDirection="back"
        class="ion-margin-top"
        [disabled]="isInvalid()"
        (click)="saveBite()"
      >
        Post
      </ion-button>
    </form>
  </ion-content>
</ta-page>
