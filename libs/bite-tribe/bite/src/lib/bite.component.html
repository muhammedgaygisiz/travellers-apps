<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>Create Bite</h1>

    <ion-card class="image-placeholder">
      <ion-card-content>
        <ion-icon name="image-outline" size="large" />
      </ion-card-content>
    </ion-card>

    <ion-list lines="full" class="ion-padding-top">
      <ion-item>
        <ion-input label="Dish Name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Location"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Price"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button
      expand="block"
      color="primary"
      routerLink="/home"
      routerDirection="back"
      class="ion-margin-top"
    >
      Post
    </ion-button>
  </ion-content>
</ta-page>
