<ta-page [showHeaderMenu]="false" [enableBackButton]="true">
  <ion-content class="ion-padding">
    <div class="settings-container">
      <form [formGroup]="settingsForm">
        <!-- Profile Section -->
        <section class="settings-section">
          <h2>Profile</h2>
          <ion-item>
            <img [src]="userImage()" alt="Profile" class="profile-image" />
            <ion-label>
              <h3>Display Name</h3>
              <ion-input
                [value]="user()?.displayName || ''"
                placeholder="Enter display name"
                readonly
              />
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-label>
              <h3>Email</h3>
              <ion-input [value]="user()?.email || ''" readonly />
            </ion-label>
          </ion-item>
        </section>

        <!-- Settings Section -->
        <section class="settings-section">
          <h2>Settings</h2>
          <ion-item>
            <ion-label>Push Notifications</ion-label>
            <ion-toggle slot="end" formControlName="pushNotifications" />
          </ion-item>
          <ion-item>
            <ion-label>Email Updates</ion-label>
            <ion-toggle slot="end" formControlName="emailUpdates" />
          </ion-item>
          <ion-item>
            <ion-label>Theme</ion-label>
            <ion-select
              slot="end"
              placeholder="Light"
              interface="popover"
              formControlName="theme"
            >
              <ion-select-option value="light">Light</ion-select-option>
              <ion-select-option value="dark">Dark</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-item>
            <ion-label>Preferred Currency</ion-label>
            <ion-select
              slot="end"
              placeholder="EUR"
              interface="popover"
              formControlName="currency"
            >
              <ion-select-option value="EUR">EUR</ion-select-option>
              <ion-select-option value="USD">USD</ion-select-option>
              <ion-select-option value="THB">THB</ion-select-option>
              <ion-select-option value="CHF">CHF</ion-select-option>
            </ion-select>
          </ion-item>
        </section>

        <!-- Action Buttons -->
        <div class="button-container">
          <ion-button fill="outline" color="medium">Log Out</ion-button>
          <ion-button
            [disabled]="isFormInvalid() || isFormPristine()"
            (click)="saveSettings()"
            >Save Changes</ion-button
          >
        </div>
      </form>
    </div>
  </ion-content>
</ta-page>
