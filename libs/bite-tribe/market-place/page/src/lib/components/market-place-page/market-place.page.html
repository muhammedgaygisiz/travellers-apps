<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>Market Place</h1>

    <div class="ion-margin-top">
      @if (biteTrails(); as trails) { @for (biteTrail of trails; track
      biteTrail.id) {
      <bite-trail [biteTrail]="biteTrail" />
      } }
    </div>
  </ion-content>
</ta-page>
