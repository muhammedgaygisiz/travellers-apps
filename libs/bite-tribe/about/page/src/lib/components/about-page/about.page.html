<ta-page
  [showHeaderMenu]="false"
  [showFooter]="false"
  [enableBackButton]="true"
>
  <ion-content class="ion-padding">
    <h1>About</h1>
    <div class="ion-margin-top">
      Total Number of Bites on Bite Tribe:
      <br />

      <ion-text color="primary">{{totalNumberBites()}}</ion-text>
    </div>
    <div class="ion-margin-top">
      Total Number of Users on Bite Tribe:
      <br />

      <ion-text color="primary">{{totalNumberUsers()}}</ion-text>
    </div>
  </ion-content>
</ta-page>
