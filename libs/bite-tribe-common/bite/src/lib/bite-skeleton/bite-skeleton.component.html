<ion-card class="bite-loading-card" data-cy="bite-loading-card">
  <div class="bite-loading-image">
    <ion-skeleton-text [animated]="true" />
  </div>

  <div class="bite-loading-details">
    <ion-card-header>
      <ion-skeleton-text class="bite-loading-title" [animated]="true" />
      <ion-skeleton-text class="bite-loading-place" [animated]="true" />
    </ion-card-header>

    <ion-card-content>
      <ion-skeleton-text class="bite-loading-rating" [animated]="true" />
      <ion-skeleton-text class="bite-loading-action" [animated]="true" />
    </ion-card-content>
  </div>
</ion-card>
