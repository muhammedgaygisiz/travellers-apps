<div class="ion-page">
  <ion-content class="ion-padding">
    <div class="container">
      <div class="ion-text-center logo-text-container">
        <img src="assets/icons/logo.svg" alt="BiteTribe Logo" class="logo" />
        <span class="company-name">BiteTribe</span>
        <span class="tagline">{{ 'find-it-try-it-share-it' | transloco }}</span>
      </div>

      <div class="ion-padding-top buttons-container">
        <ion-button expand="block" routerLink="/login">{{
          'log-in' | transloco
        }}</ion-button>

        <ion-button
          expand="block"
          fill="outline"
          routerLink="/registration"
          class="ion-margin-top"
          >{{ 'sign-up' | transloco }}</ion-button
        >
      </div>
    </div>
  </ion-content>
</div>
