<section
  class="sw"
  [class.sw--morphing]="morphing()"
  [class.sw--dismissed]="dismissed()"
  [style.--accent]="scene().accent"
  [style.--accent-soft]="scene().accentSoft"
>
  <header class="sw__top">
    <div class="sw__titles">
      <p class="sw__badge">{{ badge() }}</p>
      <h1 class="sw__headline">{{ scene().headline }}</h1>
    </div>

    @if (showSkip() && !dismissed()) {
      <button type="button" class="sw__skip" (click)="skipTour($event)">
        Skip
      </button>
    }
  </header>

  <div class="sw__dots" aria-hidden="true">
    @for (t of tips(); track t.id; let i = $index) {
      <span
        class="sw__dot"
        [class.sw__dot--done]="!dismissed() && i < tipIndex()"
        [class.sw__dot--active]="!dismissed() && i === tipIndex()"
      ></span>
    }
  </div>

  <div #stage class="sw__stage" (click)="onStageTap($event)">
    <intro-real-ui-source
      [beat]="beatId()"
      [framed]="false"
      [simulate]="false"
      [coach]="coach()"
    />

    @if (tip(); as active) {
      <div
        class="sw__coach"
        role="status"
        aria-live="polite"
        [style.--shine-x]="shineVars()['--shine-x']"
        [style.--shine-y]="shineVars()['--shine-y']"
        [style.--shine-w]="shineVars()['--shine-w']"
        [style.--shine-h]="shineVars()['--shine-h']"
        [style.--shine-r]="shineVars()['--shine-r']"
      >
        <div class="sw__veil" aria-hidden="true"></div>
        <div class="sw__glow" aria-hidden="true"></div>

        @for (_ of [animKey()]; track _) {
          <div
            class="sw__whisper"
            [class.sw__whisper--above]="tipAbove()"
            [style.--tip-top]="tipStyle()['--tip-top']"
            [style.--tip-bottom]="tipStyle()['--tip-bottom']"
            [style.--tip-left]="tipStyle()['--tip-left']"
            [style.--tip-y]="tipStyle()['--tip-y']"
          >
            <p class="sw__kicker">{{ scene().headline }}</p>
            <p class="sw__title">{{ active.title }}</p>
            <p class="sw__body">{{ active.body }}</p>
          </div>
        }
      </div>
    } @else if (dismissed()) {
      <p class="sw__resume" aria-live="polite">Tap to continue</p>
    }
  </div>
</section>
