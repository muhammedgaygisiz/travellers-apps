<ion-item class="ion-margin-top password-hint" lines="full">
  <ion-text><b i18n>Password must contain the following:</b></ion-text>
</ion-item>

<ion-item class="password-hint" lines="full">
  <ion-icon
    color="{{ hasLowerCaseLetterColor$ | async }}"
    name="{{ (hasLowerCaseLetterIcon$ | async) ?? 'close-outline' }}"
  />
  <ion-text color="{{ hasLowerCaseLetterColor$ | async }}" i18n>
    A <b>lower</b> case letter
  </ion-text>
</ion-item>

<ion-item class="password-hint" lines="full">
  <ion-icon
    color="{{ hasUpperCaseLetterColor$ | async }}"
    name="{{ (hasUpperCaseLetterIcon$ | async) ?? 'close-outline' }}"
  />
  <ion-text color="{{ hasUpperCaseLetterColor$ | async }}" i18n>
    A <b>capital</b> (uppercase) letter
  </ion-text>
</ion-item>

<ion-item class="password-hint" lines="full">
  <ion-icon
    color="{{ hasNumberColor$ | async }}"
    name="{{ (hasNumberIcon$ | async) ?? 'close-outline' }}"
  />
  <ion-text color="{{ hasNumberColor$ | async }}" i18n
    >A <b>number</b></ion-text
  >
</ion-item>

<ion-item class="password-hint" lines="full">
  <ion-icon
    color="{{ hasLength8Color$ | async }}"
    name="{{ (hasLength8Icon$ | async) ?? 'close-outline' }}"
  />
  <ion-text color="{{ hasLength8Color$ | async }}" i18n
    >Minimum <b>8 characters</b></ion-text
  >
</ion-item>
