<script>
  // Freeze ion-spinner animations for deterministic Loki captures.
  //
  // ion-spinner uses Shadow DOM (encapsulation: 'shadow') and animates its inner
  // <svg> via `:host(...) svg { animation }` inside its shadow root. No
  // document-level rule can reach across that boundary - not Storybook's, not
  // Loki's built-in animation disabler - so the spinner is otherwise captured on
  // a random rotation frame and every run produces a phantom diff. This pierces
  // each spinner's shadow root and neutralises the animation, pinning it to a
  // stable frame. Gated on Loki (window.loki.isRunning is set before the story
  // loads) so manual Storybook keeps live spinners; a MutationObserver covers
  // spinners rendered after initial load.
  (function () {
    if (!(window.loki && window.loki.isRunning)) {
      return;
    }
    var freeze = function (spinner) {
      if (!spinner.shadowRoot || spinner.__lokiFrozen) {
        return;
      }
      spinner.__lokiFrozen = true;
      var style = document.createElement('style');
      style.textContent = '* { animation: none !important; }';
      spinner.shadowRoot.appendChild(style);
    };
    var sweep = function (root) {
      if (root && root.querySelectorAll) {
        root.querySelectorAll('ion-spinner').forEach(freeze);
      }
    };
    new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        mutation.addedNodes.forEach(function (node) {
          if (node.nodeType !== 1) {
            return;
          }
          if (node.tagName === 'ION-SPINNER') {
            freeze(node);
          } else {
            sweep(node);
          }
        });
      });
    }).observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', function () {
      sweep(document);
    });
    sweep(document);
  })();
</script>
